<!DOCTYPE html>
<html class="height:100%" lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link href="static/css/global.css?v202305191" rel="stylesheet" />
	<link href="static/css/layout.css" rel="stylesheet" />
	<link href="static/css/styles.css" rel="stylesheet" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Arvo&family=Overlock&display=swap" rel="stylesheet" />
	<link href="https://use.typekit.net/rot4udi.css" rel="stylesheet" />
	<script src="static/scripts/theme-manager.js"></script>
	<title>Leaderboard - Sigil Online</title>
	<style>
		body > .main { padding-top: 80px; }
		.leaderboard {
			max-width: 500px;
			margin: 0 auto;
			padding: 24px;
			text-align: center;
		}
		.leaderboard h2 {
			font-family: 'Arvo', serif;
			color: var(--color-text-warm);
			margin-bottom: 20px;
		}
		.leaderboard-tabs a { color: inherit; margin-right: 12px; }
		.leaderboard-tabs a.is-active { font-weight: bold; text-decoration: underline; }
		.leaderboard-table {
			width: 100%;
			border-collapse: collapse;
			font-family: 'Overlock', sans-serif;
		}
		.leaderboard-table th {
			font-family: 'Arvo', serif;
			color: var(--color-text-dim);
			font-size: 0.8em;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			padding: 8px 12px;
			border-bottom: 2px solid var(--color-border);
			text-align: left;
		}
		.leaderboard-table th:first-child { text-align: center; width: 40px; }
		.leaderboard-table th:nth-child(3),
		.leaderboard-table th:nth-child(4) { text-align: right; }
		.leaderboard-table td {
			padding: 10px 12px;
			border-bottom: 1px solid var(--color-bg-mid);
			color: var(--color-text-warm);
		}
		.leaderboard-table td:first-child {
			text-align: center;
			color: var(--color-text-dim);
			font-family: 'Arvo', serif;
		}
		.leaderboard-table td:nth-child(3),
		.leaderboard-table td:nth-child(4) { text-align: right; }
		.leaderboard-table tr:nth-child(1) td:first-child { color: #ffd700; }
		.leaderboard-table tr:nth-child(2) td:first-child { color: #c0c0c0; }
		.leaderboard-table tr:nth-child(3) td:first-child { color: #cd7f32; }
		.leaderboard-table .name { font-weight: bold; }
		.leaderboard-table .name--ai { color: var(--color-accent); }
		.leaderboard-table .name--dev { color: #c8a8ff; }
		/* Light theme: the medal and dev colours above are for a dark page. */
		html[data-theme="parchment"] .leaderboard-table tr:nth-child(1) td:first-child { color: #8a6400; }
		html[data-theme="parchment"] .leaderboard-table tr:nth-child(2) td:first-child { color: #5c5c5c; }
		html[data-theme="parchment"] .leaderboard-table tr:nth-child(3) td:first-child { color: #8a4a12; }
		html[data-theme="parchment"] .leaderboard-table .name--dev,
		html[data-theme="parchment"] .name__dev-badge { color: #5b3a9a; }
		.leaderboard-table .name__dev-badge {
			margin-left: 0.4em;
			font-family: 'Source Code Pro', monospace;
			font-size: 0.75em;
			color: #c8a8ff;
			font-weight: normal;
			vertical-align: middle;
		}
		.leaderboard-table .elo {
			font-family: 'Arvo', serif;
			color: var(--color-text-bright);
		}
		.loading-msg {
			color: var(--color-border-hover);
			font-family: 'Overlock', sans-serif;
			padding: 40px 0;
		}
		.empty-msg {
			color: var(--color-text-faint);
			font-family: 'Overlock', sans-serif;
			padding: 40px 0;
		}
		.back-link {
			display: inline-block;
			margin-top: 20px;
			color: var(--color-accent);
			font-family: 'Overlock', sans-serif;
			text-decoration: none;
		}
		.back-link:hover { text-decoration: underline; }
		.pagination {
			margin-top: 16px;
			display: flex;
			justify-content: center;
			gap: 8px;
		}
		.pagination__btn {
			padding: 6px 14px;
			border: 2px solid var(--color-border);
			border-radius: 6px;
			background: var(--color-surface);
			color: var(--color-text-warm);
			font-family: 'Overlock', sans-serif;
			font-size: 0.9em;
			cursor: pointer;
		}
		.pagination__btn:hover { border-color: var(--color-text-dim); }
		.pagination__btn:disabled { opacity: 0.4; cursor: default; }
		.leaderboard-tools {
			display: flex;
			gap: 8px;
			margin-bottom: 12px;
		}
		.leaderboard-search {
			flex: 1;
			min-width: 0;
			padding: 6px 10px;
			border: 2px solid var(--color-border);
			border-radius: 6px;
			background: var(--color-surface);
			color: var(--color-text-warm);
			font-family: 'Overlock', sans-serif;
			font-size: 0.95em;
		}
		.leaderboard-table .provisional {
			margin-left: 2px;
			color: var(--color-text-dim);
			cursor: help;
		}
		.leaderboard-table tr.is-me td { background: var(--color-surface-raised, rgba(136, 170, 255, 0.15)); }
		.my-entry {
			margin-top: 14px;
			font-family: 'Overlock', sans-serif;
			color: var(--color-text-warm);
		}
		.my-entry__note { color: var(--color-text-dim); font-size: 0.9em; }
		.pagination__info {
			padding: 6px 0;
			color: var(--color-text-dim);
			font-family: 'Overlock', sans-serif;
			font-size: 0.85em;
			align-self: center;
		}
	</style>
</head>
<body>
	<header>
		<div class="container">
			<div class="header-container">
				<div>
					<h1 class="logo"><a href="./"><span class="visually-hidden">Sigil Online</span><img alt="" src="static/images/logo-icon.svg" height="40" width="32" /></a></h1>
				</div>
				<h1></h1>
				<div id="auth-status"></div>
			</div>
		</div>
	</header>

	<div class="main" x-data="leaderboardPage()">
		<div class="leaderboard">
			<h2>Leaderboard</h2>
			<p class="leaderboard-tabs">
				<a href="leaderboard.html" x-bind:class="{ 'is-active': tab === 'games' }">Games</a>
				<a href="leaderboard.html?tab=puzzles" x-bind:class="{ 'is-active': tab === 'puzzles' }">Puzzles</a>
			</p>

			<p class="loading-msg" x-show="loading && !isOffline" x-cloak>Loading rankings...</p>
			<p class="empty-msg" x-show="isOffline" x-cloak>Leaderboard rankings are unavailable while offline. <a href="./" style="color: inherit;">Back to menu</a> to play local games.</p>
			<p class="empty-msg" x-show="!loading && !isOffline && allPlayers.length === 0" x-cloak x-text="tab === 'puzzles' ? 'No rated puzzle attempts yet.' : 'No ranked games played yet.'"></p>

			<div class="leaderboard-tools" x-show="!loading && allPlayers.length > 0" x-cloak>
				<input class="leaderboard-search" type="search" x-model="query" x-on:input="page = 0" placeholder="Search players" aria-label="Search players by name" />
				<button class="pagination__btn" x-show="myUid" x-on:click="findMe()">Find me</button>
			</div>
			<p class="empty-msg" x-show="!loading && allPlayers.length > 0 && filteredPlayers.length === 0" x-cloak x-text="'No player in the top ' + limit + ' matches \u201c' + query + '\u201d.'"></p>

			<table class="leaderboard-table" x-show="!loading && filteredPlayers.length > 0" x-cloak>
				<thead>
					<tr>
						<th>#</th>
						<th>Player</th>
						<th>Rating</th>
						<th x-text="tab === 'puzzles' ? 'Puzzles' : 'Games'">Games</th>
					</tr>
				</thead>
				<tbody>
					<template x-for="(player, index) in pagePlayers" x-bind:key="player.uid">
						<tr x-bind:id="'lb-row-' + player.uid" x-bind:class="{ 'is-me': player.uid === highlightUid }">
							<td x-text="player.rank"></td>
							<td class="name" x-bind:class="{ 'name--ai': player.isAI, 'name--dev': player.isDeveloper }">
								<a x-bind:href="'profile.html?uid=' + player.uid" x-bind:class="{ 'name--ai': player.isAI, 'name--dev': player.isDeveloper }" style="color: inherit; text-decoration: none;" x-text="player.displayName"></a>
								<template x-if="player.isDeveloper"><span class="name__dev-badge">[dev]</span></template>
							</td>
							<td class="elo"><span x-text="player.elo"></span><template x-if="player.gamesPlayed < provisionalGames"><span class="provisional" x-bind:title="'Provisional: fewer than ' + provisionalGames + ' rated games'" x-bind:aria-label="'provisional, fewer than ' + provisionalGames + ' rated games'">?</span></template></td>
							<td x-text="player.gamesPlayed"></td>
						</tr>
					</template>
				</tbody>
			</table>

			<div class="pagination" x-show="totalPages > 1" x-cloak>
				<button class="pagination__btn" x-on:click="prevPage" x-bind:disabled="page === 0">&larr; Prev</button>
				<span class="pagination__info" x-text="(page + 1) + ' / ' + totalPages"></span>
				<button class="pagination__btn" x-on:click="nextPage" x-bind:disabled="page >= totalPages - 1">Next &rarr;</button>
			</div>

			<div class="my-entry" x-show="myEntry" x-cloak>
				<template x-if="myEntry">
					<div>
						<strong x-text="myEntry.displayName"></strong>:
						<span x-text="myEntry.elo"></span><span class="provisional" x-show="myEntry.gamesPlayed < provisionalGames" x-bind:title="'Provisional: fewer than ' + provisionalGames + ' rated games'">?</span>
						(<span x-text="myEntry.gamesPlayed"></span> games)
						<div class="my-entry__note" x-text="'Not in the top ' + limit + '.'"></div>
					</div>
				</template>
			</div>

			<a class="back-link" href="./">&larr; Back to menu</a>
		</div>
	</div>

	<!-- Firebase SDK -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
	<script>
		firebase.initializeApp({
			apiKey: "AIzaSyDcYsA9GxotScZ6m92B_TDSArkeN1qMHvE",
			authDomain: "sigil-js.firebaseapp.com",
			databaseURL: "https://sigil-js-default-rtdb.firebaseio.com",
			projectId: "sigil-js",
			storageBucket: "sigil-js.firebasestorage.app",
			messagingSenderId: "174679859896",
			appId: "1:174679859896:web:9f8e5ddc4388ae73a60a4d"
		});
	</script>
	<script src="static/scripts/auth-status.js"></script>

	<script>
		document.addEventListener('alpine:init', () => {
			Alpine.data('leaderboardPage', () => ({
				allPlayers: [],
				loading: true,
				// ?tab=puzzles: puzzle ratings (puzzle_leaderboard/, puzzle-rating.js).
				tab: new URLSearchParams(location.search).get('tab') === 'puzzles' ? 'puzzles' : 'games',
				isOffline: !navigator.onLine,
				page: 0,
				perPage: 100,
				// Only the top `limit` ratings are loaded.
				limit: 200,
				// Fewer rated games than this marks a rating provisional.
				provisionalGames: 10,
				query: '',
				// The signed-in player (not a guest), their highlighted row, and
				// their own entry when they are outside the loaded rows.
				myUid: null,
				highlightUid: null,
				myEntry: null,

				get filteredPlayers() {
					const q = this.query.trim().toLowerCase();
					if (!q) return this.allPlayers;
					return this.allPlayers.filter((p) => p.displayName.toLowerCase().includes(q));
				},

				get totalPages() {
					return Math.max(1, Math.ceil(this.filteredPlayers.length / this.perPage));
				},

				get pageStart() {
					return this.page * this.perPage;
				},

				get pagePlayers() {
					return this.filteredPlayers.slice(this.pageStart, this.pageStart + this.perPage);
				},

				/** Scroll to the signed-in player's row, or show their entry if outside the top. */
				async findMe() {
					if (!this.myUid) return;
					this.query = '';
					const i = this.allPlayers.findIndex((p) => p.uid === this.myUid);
					if (i >= 0) {
						this.myEntry = null;
						this.page = Math.floor(i / this.perPage);
						this.highlightUid = this.myUid;
						this.$nextTick(() => {
							const row = document.getElementById('lb-row-' + this.myUid);
							if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
						});
						return;
					}
					try {
						const d = (await firebase.database().ref('users/' + this.myUid).once('value')).val() || {};
						this.myEntry = {
							displayName: d.displayName || 'You',
							elo: d.elo ?? 1000,
							gamesPlayed: d.gamesPlayed || 0,
						};
					} catch (e) {
						console.error('Failed to load your rating:', e);
					}
				},

				prevPage() { if (this.page > 0) this.page--; },
				nextPage() { if (this.page < this.totalPages - 1) this.page++; },

				async init() {
					if (!this._netListenersAdded) {
						this._netListenersAdded = true;
						window.addEventListener('online', () => { this.isOffline = false; if (this.allPlayers.length === 0) this.init(); });
						window.addEventListener('offline', () => { this.isOffline = true; this.loading = false; });
					}
					if (this.isOffline) {
						this.loading = false;
						return;
					}
					const db = firebase.database();

					if (this.tab === 'puzzles') {
						try {
							const snap = await db.ref('puzzle_leaderboard').orderByChild('rating').limitToLast(500).once('value');
							const results = [];
							snap.forEach((child) => {
								const d = child.val() || {};
								results.push({ uid: child.key, displayName: d.displayName || 'Unknown',
									elo: d.rating ?? 1500, gamesPlayed: d.plays || 0, isAI: false, isDeveloper: false });
							});
							this.allPlayers = results.reverse();
						} catch (e) {
							console.error('Failed to load the puzzle leaderboard:', e);
						}
						this.loading = false;
						return;
					}

					// Seed AI entries (best-effort, never blocks the read)
					try { await this._seedAIs(db); } catch (e) { console.warn('AI seeding skipped:', e.message); }

					// Fetch leaderboard
					try {
						// The limit must apply to displayed (played) entries:
						// zero-game records (e.g. seeded AIs) can sit inside the
						// top Elo window, so over-fetch until `limit` eligible
						// entries are found or the leaderboard is exhausted.
						let fetchN = this.limit;
						let results = [];
						for (;;) {
							const snap = await db.ref('leaderboard')
								.orderByChild('elo')
								.limitToLast(fetchN)
								.once('value');
							results = [];
							snap.forEach((child) => {
								const data = child.val();
								const gamesPlayed = data.gamesPlayed || 0;
								if (gamesPlayed === 0) return;
								results.push({
									uid: child.key,
									displayName: data.displayName || 'Unknown',
									elo: data.elo ?? 1000,
									gamesPlayed: gamesPlayed,
									isAI: data.isAI || false,
									isDeveloper: data.isDeveloper || false,
								});
							});
							if (results.length >= this.limit || snap.numChildren() < fetchN) break;
							fetchN += (this.limit - results.length) + 50;
						}
						results = results.slice(-this.limit);

						this.allPlayers = results.reverse();
						this.allPlayers.forEach((p, i) => { p.rank = i + 1; });
					} catch (e) {
						console.error('Failed to load leaderboard:', e);
					}

					this.loading = false;
				},

				async _seedAIs(db) {
					// Wait for auth state to resolve before deciding whether to sign in
					await new Promise(resolve => {
						const unsub = firebase.auth().onAuthStateChanged(() => { unsub(); resolve(); });
					});
					const u = firebase.auth().currentUser;
					this.myUid = u && !u.isAnonymous ? u.uid : null;
					// Only sign in anonymously if truly no user (don't overwrite real sessions)
					if (!firebase.auth().currentUser) {
						await firebase.auth().signInAnonymously();
					}
					// Fallback seeding for a fresh database only (the exists-guard
					// never touches live records). The production records were
					// migrated by ai/migrate_ai_tiers_rust.py: JS tiers renamed
					// "(JS)", Rust tiers created 200 Elo above their JS
					// counterparts — 1200 here mirrors that offset from baseline.
					const ais = [
						{ uid: '__ai_easy__', name: 'AI (Easy) (JS)', elo: 1000 },
						{ uid: '__ai_medium__', name: 'AI (Medium) (JS)', elo: 1000 },
						{ uid: '__ai_rust_easy__', name: 'AI (Easy) (Rust)', elo: 1200 },
						{ uid: '__ai_rust_medium__', name: 'AI (Medium) (Rust)', elo: 1200 },
						{ uid: '__ai_rust_hard__', name: 'AI (Hard) (Rust)', elo: 1200 },
						{ uid: '__ai_rust_very_hard__', name: 'AI (Very Hard) (Rust)', elo: 1200 },
						// §0.3 frozen reference engine; seeded at the rating its
						// configuration measured against humans (rust_hard, 2026-09-09).
						{ uid: '__ai_rust_anchor__', name: 'AI (Anchor 2026-09)', elo: 1300 },
					];
					for (const ai of ais) {
						const snap = await db.ref('leaderboard/' + ai.uid).once('value');
						if (!snap.exists()) {
							await db.ref('leaderboard/' + ai.uid).set({
								displayName: ai.name,
								elo: ai.elo,
								gamesPlayed: 0,
								isAI: true,
							});
							await db.ref('users/' + ai.uid).set({
								displayName: ai.name,
								elo: ai.elo,
								gamesPlayed: 0,
								wins: 0,
								losses: 0,
								created: Date.now(),
								isAI: true,
							});
						}
					}
				},
			}));
		});
	</script>

	<script src="https://unpkg.com/alpinejs@3.10.4/dist/cdn.min.js"></script>
</body>
</html>
