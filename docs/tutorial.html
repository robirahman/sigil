		<title>Tutorial - Sigil Online</title>
		<style>
			header { position: absolute; }
			body > .main { padding-top: 0px; }

			.tutorial-panel {
				font-family: 'Overlock', sans-serif;
				color: var(--color-text-warm, #eee);
				padding: 56px 0 8px;
				max-width: 640px;
			}
			.tutorial-panel__count {
				color: var(--color-text-muted, #aaa);
				font-size: 0.85em;
				margin: 0;
			}
			.tutorial-panel__title {
				font-family: 'Arvo', serif;
				font-size: 1.35em;
				margin: 0 0 6px;
			}
			.tutorial-panel__intro p { margin: 0 0 8px; line-height: 1.45; }
			.tutorial-panel__step,
			.tutorial-panel__hint,
			.tutorial-panel__success {
				margin: 8px 0;
				padding: 10px 12px;
				border-radius: 6px;
				line-height: 1.45;
			}
			.tutorial-panel__step {
				border: 1px solid #d4af37;
				background: rgba(212, 175, 55, 0.12);
			}
			.tutorial-panel__hint {
				border: 1px solid #e0604a;
				background: rgba(224, 96, 74, 0.12);
			}
			.tutorial-panel__success {
				border: 1px solid #6fd46f;
				background: rgba(111, 212, 111, 0.12);
			}
			.tutorial-panel__success strong { color: #6fd46f; }
			.tutorial-panel__success p { margin: 4px 0; }
			.tutorial-panel__nav {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin: 10px 0 4px;
			}
			.tutorial-panel__nav .action-button { margin: 0; }
			.tutorial-lessons {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				list-style: none;
				padding: 0;
				margin: 8px 0 0;
			}
			.tutorial-lessons button {
				font: inherit;
				font-size: 0.85em;
				color: inherit;
				background: transparent;
				border: 1px solid var(--color-border, #555);
				border-radius: 14px;
				padding: 3px 10px;
				cursor: pointer;
			}
			.tutorial-lessons button.is-current { border-color: #d4af37; font-weight: bold; }
			.tutorial-lessons button.is-done::before { content: '\2713\00a0'; color: #6fd46f; }
			.back-link { color: var(--color-accent); }
			/* The node, spell or button the current step wants: a pulsing gold
			   ring, distinct from the game's own red/blue legal-move rings. */
			.stone-node--tutorial-target::after {
				content: '';
				position: absolute; inset: -6px;
				border: 3px solid #f0d77a;
				border-radius: 50%;
				box-shadow: 0 0 10px 3px rgba(240, 215, 122, 0.8);
				animation: tutorial-target-pulse 1s ease-in-out infinite alternate;
				pointer-events: none;
			}
			.spell--tutorial-target {
				outline: 3px solid #f0d77a;
				outline-offset: 2px;
				border-radius: 50%;
			}
			.action-button--tutorial-target {
				outline: 3px solid #f0d77a;
				outline-offset: 2px;
			}
			@keyframes tutorial-target-pulse { from { opacity: 0.45; } to { opacity: 1; } }
		</style>

		<div class="main">
			<!-- The lessons (static/scripts/tutorial-lessons.js) are played on the
			     real board: game-board-local.js in tutorial mode checks each click
			     against the lesson's script before the GameController applies it. -->
			<div x-data="gameBoard({ tutorial: window.SIGIL_TUTORIAL })" id="tutorial-root">
				<div class="container">
					<div class="container__inner">
						<div class="tutorial-panel">
							<p class="tutorial-panel__count" x-text="'Tutorial · lesson ' + (tutorialIndex + 1) + ' of ' + tutorial.lessons.length"></p>
							<h2 class="tutorial-panel__title" x-text="tutorialLesson.title"></h2>
							<div class="tutorial-panel__intro" x-html="tutorialLesson.intro"></div>

							<!-- x-if, not x-show: Alpine 3.10 throws when x-show hides
							     several of these in one tick. -->
							<template x-if="tutorialHint && tutorialStatus === 'playing'">
								<div class="tutorial-panel__hint">
									<strong>Not quite.</strong> <span x-html="tutorialHint"></span> The lesson has been reset.
								</div>
							</template>
							<template x-if="tutorialStatus === 'playing' && tutorialLesson.steps[tutorialStep]">
								<div class="tutorial-panel__step" x-html="tutorialLesson.steps[tutorialStep].say"></div>
							</template>
							<template x-if="tutorialStatus === 'done'">
								<div class="tutorial-panel__success">
									<strong>Well done!</strong>
									<div x-html="tutorialLesson.success"></div>
								</div>
							</template>

							<div class="tutorial-panel__nav">
								<template x-if="tutorialStatus === 'done' && tutorialIndex < tutorial.lessons.length - 1">
									<button class="action-button tutorial-next" x-on:click="tutorialGo(tutorialIndex + 1)">Next lesson &rarr;</button>
								</template>
								<template x-if="tutorialStatus === 'done' && tutorialIndex === tutorial.lessons.length - 1">
									<a class="action-button" href="./">Play a game</a>
								</template>
								<button class="action-button tutorial-restart" x-on:click="tutorialRestart()">Restart lesson</button>
								<template x-if="tutorialIndex > 0">
									<button class="action-button" x-on:click="tutorialGo(tutorialIndex - 1)">&larr; Previous</button>
								</template>
								<template x-if="tutorialStatus !== 'done' && tutorialIndex < tutorial.lessons.length - 1">
									<button class="action-button" x-on:click="tutorialGo(tutorialIndex + 1)">Skip &rarr;</button>
								</template>
							</div>
							<ol class="tutorial-lessons" aria-label="Lessons">
								<template x-for="(l, i) in tutorial.lessons" x-bind:key="l.id">

											x-bind:class="{ 'is-current': i === tutorialIndex, 'is-done': !!tutorialDone[l.id] }"

		<script>
			// Stale-asset guard. On the first load after a deploy, a returning
			// visitor's old service worker serves its cached scripts with this fresh
			// page. If they predate the page (SIGIL_ASSET_EPOCH in constants.js),
			// drop the caches, refetch the page's scripts past the HTTP cache, and
			// reload once. The new worker deletes the stale cache when it activates.
			(function () {
				if (typeof SIGIL_ASSET_EPOCH !== 'undefined' && SIGIL_ASSET_EPOCH >= 2) return;
				if (!window.caches || !window.fetch) return;
				try {
					if (sessionStorage.getItem('sigilStaleAssetReload') === '1') return;
					sessionStorage.setItem('sigilStaleAssetReload', '1');
				} catch (e) { return; }
				document.addEventListener('DOMContentLoaded', function () {
					var urls = ['static/scripts/engine/ai-worker.js'];
					Array.prototype.forEach.call(document.scripts, function (s) {
						if (s.src && s.src.indexOf(location.origin) === 0) urls.push(s.src);
					});
					caches.keys()
						.then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
						.then(function () {
							return Promise.all(urls.map(function (u) {
								return fetch(u, { cache: 'reload' }).catch(function () {});
							}));
						})
						.catch(function () {})
						.then(function () { location.reload(); });
				});
			})();
		</script>

			});
		</script>
		<script src="static/scripts/auth-status.js"></script>

		<script>
			// Which lesson to open: ?lesson=N (1-based), else the first lesson not
			// yet finished on this device, else the first.
			(function () {
				var lessons = window.SIGIL_TUTORIAL_LESSONS || [];
				var done = {};
				try { done = JSON.parse(localStorage.getItem('sigil_tutorial_done') || '{}') || {}; } catch (e) { done = {}; }
				var n = parseInt(new URLSearchParams(window.location.search).get('lesson'), 10);
				var start = (n >= 1 && n <= lessons.length) ? n - 1 : -1;
				if (start < 0) {
					for (var i = 0; i < lessons.length; i++) {
						if (!done[lessons[i].id]) { start = i; break; }
					}
				}
				window.SIGIL_TUTORIAL = { lessons: lessons, start: Math.max(0, start) };
			})();
		</script>
