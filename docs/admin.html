<!DOCTYPE html>
<html class="height:100%" lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex" />
	<link href="static/css/global.css?v202305191" rel="stylesheet" />
	<link href="static/css/layout.css" rel="stylesheet" />
	<link href="static/css/styles.css?v=35" rel="stylesheet" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Arvo&family=Overlock&display=swap" rel="stylesheet" />
	<link href="https://use.typekit.net/rot4udi.css" rel="stylesheet" />
	<script src="static/scripts/theme-manager.js"></script>
	<title>Admin - Sigil Online</title>
	<style>
		body > .main { padding-top: 80px; }
		.admin {
			max-width: 860px;
			margin: 0 auto;
			padding: 24px 16px;
			box-sizing: border-box;
			font-family: 'Overlock', sans-serif;
			color: var(--color-text-warm);
		}
		.admin h2, .admin h3 { font-family: 'Arvo', serif; color: var(--color-text-bright); }
		.admin h2 { font-size: 1.6em; margin-bottom: 8px; }
		.admin h3 { font-size: 1.1em; margin: 24px 0 8px; }
		.admin a { color: var(--color-accent); }
		.admin__msg { color: var(--color-text-dim); font-style: italic; padding: 12px 0; }
		.admin__tabs { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
		.admin__tab, .admin__btn {
			background: rgba(255, 255, 255, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.4);
			border-radius: 6px;
			color: var(--color-text-warm);
			cursor: pointer;
			font-family: inherit;
			font-size: 0.9em;
			padding: 6px 12px;
		}
		.admin__tab--active { background: var(--color-surface-hover); border-color: var(--color-accent); }
		.admin__btn:hover, .admin__tab:hover { background: rgba(255, 255, 255, 0.2); }
		.admin__btn--danger { background: var(--color-btn-reset); border-color: var(--color-btn-reset); color: #fff; }
		.admin__btn:disabled { opacity: 0.5; cursor: default; }
		.report-card {
			background: var(--color-surface);
			border-left: 4px solid var(--color-error);
			border-radius: 8px;
			margin-bottom: 12px;
			padding: 12px 16px;
			overflow-wrap: anywhere;
		}
		.report-card--resolved { border-left-color: var(--color-success); opacity: 0.8; }
		.report-card__head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
		.report-card__reason { font-weight: bold; color: var(--color-text-bright); text-transform: capitalize; }
		.report-card__meta { color: var(--color-text-dim); font-size: 0.85em; }
		.report-card__note { margin: 8px 0; white-space: pre-wrap; }
		.report-card__flags { font-size: 0.9em; color: var(--color-text-dim); margin: 6px 0; }
		.report-card__flags strong { color: var(--color-error); }
		.report-card__controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
		.report-card textarea, .report-card select, .report-card input {
			background: var(--color-bg-mid);
			border: 1px solid var(--color-border);
			border-radius: 6px;
			box-sizing: border-box;
			color: var(--color-text);
			font-family: inherit;
			font-size: 0.9em;
			padding: 6px;
		}
		.report-card textarea { width: 100%; margin-top: 8px; }
		.report-card input { flex: 1 1 160px; min-width: 0; }
		.flags-table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
		.flags-table th, .flags-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--color-bg-mid); }
		.flags-table th { color: var(--color-text-dim); font-family: 'Arvo', serif; font-size: 0.8em; text-transform: uppercase; }
		.admin-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; padding: 12px 16px; background: var(--color-surface); border-radius: 8px; }
		.admin-form label { display: flex; flex-direction: column; gap: 3px; font-size: 0.85em; color: var(--color-text-dim); }
		.admin-form label.admin-form__wide { grid-column: 1 / -1; }
		.admin-form input, .admin-form select, .admin-form textarea {
			background: var(--color-bg-mid);
			border: 1px solid var(--color-border);
			border-radius: 6px;
			box-sizing: border-box;
			color: var(--color-text);
			font-family: inherit;
			font-size: 1em;
			padding: 6px;
			min-width: 0;
		}
		.admin-form__actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
		.admin-note { color: var(--color-text-dim); font-size: 0.85em; }
	</style>
</head>
<body>
	<header>
		<div class="container">
			<div class="header-container">
				<div>
					<h1 class="logo"><a href="./"><span class="visually-hidden">Sigil Online</span><img alt="" src="static/images/logo-icon.svg" height="40" width="32" /></a></h1>
				</div>
				<h1></h1>
				<div id="auth-status"></div>
			</div>
		</div>
	</header>

	<div class="main" x-data="adminPage()">
		<div class="admin">
			<h2>Admin</h2>
			<p class="admin__msg" x-show="state === 'loading'">Loading...</p>
			<p class="admin__msg" x-show="state === 'signed-out'" x-cloak>Sign in on the <a href="account.html">account page</a> first.</p>
			<p class="admin__msg" x-show="state === 'denied'" x-cloak data-testid="admin-denied">This page is for site admins. (An admin is added by hand at admins/{uid} in the database.)</p>
			<p class="admin__msg" x-show="error" x-cloak x-text="error"></p>

			<template x-if="state === 'ready'">
				<div>
					<div class="admin__tabs" role="tablist">
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'open' }" x-on:click="view = 'open'" x-text="'Open reports (' + openCount + (openTruncated ? '+, oldest shown' : '') + ')'"></button>
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'all' }" x-on:click="view = 'all'" x-text="'All reports (' + reports.length + ')'"></button>
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'players' }" x-on:click="view = 'players'">Suspensions and abandonments</button>
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'events' }" x-on:click="openEvents()" data-testid="admin-events-tab">Events and announcements</button>
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'titles' }" x-on:click="openTitles()" data-testid="admin-titles-tab">Verified titles</button>
					</div>

					<template x-if="view === 'open' || view === 'all'">
						<div>
							<p class="admin__msg" x-show="shownReports.length === 0">No reports here.</p>
							<template x-for="r in shownReports" x-bind:key="r.id">
								<div class="report-card" x-bind:class="{ 'report-card--resolved': r.resolved }" data-testid="report-card">
									<div class="report-card__head">
										<span class="report-card__reason" x-text="reasonText(r.reason)"></span>
										<span>against <a x-bind:href="'profile.html?uid=' + encodeURIComponent(r.target)" x-text="nameOf(r.target)" data-testid="report-target"></a></span>
										<span class="report-card__meta">by <a x-bind:href="'profile.html?uid=' + encodeURIComponent(r.by)" x-text="nameOf(r.by)"></a> &middot; <span x-text="when(r.at)"></span></span>
										<template x-if="r.room"><span class="report-card__meta">game <a x-bind:href="'multiplayer.html?id=' + encodeURIComponent(r.room)" x-text="r.room"></a></span></template>
									</div>
									<p class="report-card__note" x-show="r.note" x-text="r.note"></p>
									<p class="report-card__flags">
										<span x-text="(flagsOf(r.target).abandons || 0) + ' upheld abandonment' + ((flagsOf(r.target).abandons || 0) === 1 ? '' : 's')"></span>
										&middot; <span x-text="(reportCount[r.target] || 0) + ' report(s) in all'"></span>
										<template x-if="banned(r.target)"><span> &middot; <strong x-text="'Suspended ' + banText(r.target)"></strong></span></template>
									</p>
									<template x-if="r.resolved">
										<p class="report-card__meta">Resolved<span x-show="r.resolvedAt" x-text="' ' + when(r.resolvedAt)"></span><span x-show="r.adminNote" x-text="': ' + r.adminNote"></span></p>
									</template>
									<template x-if="!r.resolved">
										<div>
											<textarea rows="2" maxlength="1000" placeholder="Admin note (kept with the report)" x-model="drafts[r.id]"></textarea>
											<div class="report-card__controls">
												<button class="admin__btn" x-on:click="resolve(r)" x-bind:disabled="busy" data-testid="resolve">Mark resolved</button>
												<select x-model="banDays[r.target]" aria-label="Suspension length">
													<option value="1">1 day</option>
													<option value="7">7 days</option>
													<option value="30">30 days</option>
													<option value="forever">Indefinitely</option>
												</select>
												<input type="text" maxlength="500" placeholder="Reason shown to the player" x-model="banReasons[r.target]" aria-label="Suspension reason" />
												<button class="admin__btn admin__btn--danger" x-on:click="ban(r.target)" x-bind:disabled="busy" data-testid="ban">Suspend from rated play</button>
												<button class="admin__btn" x-show="banned(r.target)" x-on:click="lift(r.target)" x-bind:disabled="busy">Lift suspension</button>
											</div>
										</div>
									</template>
								</div>
							</template>
						</div>
					</template>

					<!-- site_events/: the banner on every page and events.html -->
					<template x-if="view === 'events'">
						<div>
							<h3>Post an event or announcement</h3>
							<div class="admin-form" data-testid="event-form">
								<label>Kind
									<select x-model="ev.kind" x-on:change="evDefaults()">
										<option value="event">Event (with a start and end)</option>
										<option value="announcement">Announcement</option>
									</select>
								</label>
								<label class="admin-form__wide">Title (shown in the banner)
									<input type="text" maxlength="120" x-model="ev.title" data-testid="event-title" />
								</label>
								<label class="admin-form__wide">Details (optional, on the events page)
									<textarea rows="3" maxlength="1000" x-model="ev.body"></textarea>
								</label>
								<label class="admin-form__wide">Link (optional): https://… or a page of this site, e.g. multiplayer.html
									<input type="text" maxlength="300" x-model="ev.link" placeholder="https://discord.gg/…" />
								</label>
								<label><span x-text="ev.kind === 'event' ? 'Starts (your time)' : 'Shown from (your time)'"></span>
									<input type="datetime-local" x-model="ev.start" data-testid="event-start" />
								</label>
								<label><span x-text="ev.kind === 'event' ? 'Ends' : 'Shown until'"></span>
									<input type="datetime-local" x-model="ev.end" data-testid="event-end" />
								</label>
								<div class="admin-form__actions">
									<button class="admin__btn" type="button" x-on:click="postEvent()" x-bind:disabled="busy" data-testid="event-post">Post</button>
									<span class="admin-note">Events show in the banner from a day before they start until they end; announcements for their whole window. Visitors can dismiss each one.</span>
								</div>
							</div>
							<h3>Posted</h3>
							<p class="admin__msg" x-show="siteEvents.length === 0">Nothing posted yet.</p>
							<template x-for="e in siteEvents" x-bind:key="e.id">
								<div class="report-card" x-bind:class="{ 'report-card--resolved': e.endsAt <= Date.now() }" x-bind:data-event="e.id">
									<div class="report-card__head">
										<span class="report-card__reason" x-text="e.kind"></span>
										<span x-text="e.title"></span>
										<span class="report-card__meta" x-text="when(e.startsAt) + ' \u2013 ' + when(e.endsAt)"></span>
									</div>
									<p class="report-card__note" x-show="e.body" x-text="e.body"></p>
									<div class="report-card__controls">
										<a x-bind:href="'events.html#' + encodeURIComponent(e.id)">view</a>
										<button class="admin__btn admin__btn--danger" type="button" x-on:click="deleteEvent(e)" x-bind:disabled="busy">Delete</button>
									</div>
								</div>
							</template>
						</div>
					</template>

					<!-- titles/: verified titles on profiles -->
					<template x-if="view === 'titles'">
						<div>
							<h3>Grant a title</h3>
							<div class="admin-form" data-testid="title-form">
								<label>Player (name or uid)
									<input type="text" maxlength="128" x-model="tg.who" data-testid="title-who" />
								</label>
								<label>Title (up to 32 characters)
									<input type="text" maxlength="32" x-model="tg.title" list="title-suggestions" data-testid="title-text" />
									<datalist id="title-suggestions">
										<option value="Site Champion"></option>
										<option value="Developer"></option>
										<option value="Moderator"></option>
										<option value="Tournament Director"></option>
										<option value="Coach"></option>
										<option value="Spell Designer"></option>
									</datalist>
								</label>
								<div class="admin-form__actions">
									<button class="admin__btn" type="button" x-on:click="grantTitle()" x-bind:disabled="busy" data-testid="title-grant">Grant</button>
									<span class="admin-note">Shown next to the player's name on their profile, marked as verified. Granting again replaces it.</span>
								</div>
							</div>
							<h3>Titles</h3>
							<p class="admin__msg" x-show="titleRows.length === 0">No titles granted.</p>
							<table class="flags-table" x-show="titleRows.length > 0">
								<thead><tr><th>Player</th><th>Title</th><th>Granted</th><th></th></tr></thead>
								<tbody>
									<template x-for="t in titleRows" x-bind:key="t.uid">
										<tr x-bind:data-title="t.uid">
											<td><a x-bind:href="'profile.html?uid=' + encodeURIComponent(t.uid)" x-text="nameOf(t.uid)"></a></td>
											<td x-text="t.title"></td>
											<td x-text="when(t.at) + ' by ' + nameOf(t.by)"></td>
											<td><button class="admin__btn" type="button" x-on:click="revokeTitle(t.uid)" x-bind:disabled="busy">Remove</button></td>
										</tr>
									</template>
								</tbody>
							</table>
						</div>
					</template>

					<template x-if="view === 'players'">
						<div>
							<p class="admin__msg" x-show="flagRows.length === 0">No suspensions or abandonments recorded.</p>
							<table class="flags-table" x-show="flagRows.length > 0">
								<thead><tr><th>Player</th><th>Abandonments</th><th>Suspension</th><th></th></tr></thead>
								<tbody>
									<template x-for="f in flagRows" x-bind:key="f.uid">
										<tr>
											<td><a x-bind:href="'profile.html?uid=' + encodeURIComponent(f.uid)" x-text="nameOf(f.uid)"></a></td>
											<td x-text="f.abandons || 0"></td>
											<td><span x-text="banned(f.uid) ? banText(f.uid) : 'none'"></span><span x-show="f.reason && banned(f.uid)" x-text="' (' + f.reason + ')'"></span></td>
											<td><button class="admin__btn" x-show="banned(f.uid)" x-on:click="lift(f.uid)" x-bind:disabled="busy">Lift</button></td>
										</tr>
									</template>
								</tbody>
							</table>
						</div>
					</template>
				</div>
			</template>
		</div>
	</div>

	<script>
		// Reports (reports/), suspensions and abandonment counts (user_flags/).
		// The rules let only admins (admins/{uid} === true) read either or
		// write user_flags; a report's own fields stay as filed.
		document.addEventListener('alpine:init', () => {
			// A suspension "indefinitely": far enough out to be permanent.
			const FOREVER = Date.UTC(2200, 0, 1);
			Alpine.data('adminPage', () => ({
				state: 'loading',
				error: '',
				busy: false,
				uid: null,
				view: 'open',
				reports: [],
				flags: {},
				names: {},
				drafts: {},
				banDays: {},
				banReasons: {},

				get openCount() { return this.reports.filter((r) => !r.resolved).length; },
				get shownReports() { return this.view === 'open' ? this.reports.filter((r) => !r.resolved) : this.reports; },
				// Every report on each target, counted by query: the loaded
				// window (open + latest 500) may not hold them all.
				reportCount: {},
				// More open reports than the queue loads (reload).
				openTruncated: false,
				get flagRows() {
					return Object.keys(this.flags).map((uid) => Object.assign({ uid }, this.flags[uid]))
						.filter((f) => f.abandons > 0 || typeof f.banUntil === 'number')
						.sort((a, b) => (this.banned(b.uid) - this.banned(a.uid)) || ((b.abandons || 0) - (a.abandons || 0)));
				},

				// Events and announcements (site_events/), verified titles (titles/).
				ev: { kind: 'event', title: '', body: '', link: '', start: '', end: '' },
				siteEvents: [],
				tg: { who: '', title: '' },
				titles: {},
				get titleRows() {
					return Object.keys(this.titles).map((uid) => Object.assign({ uid }, this.titles[uid])).sort((a, b) => (b.at || 0) - (a.at || 0));
				},

				init() {
					firebase.auth().onAuthStateChanged((u) => this._start(u));
					this.evDefaults();
				},

				async _start(u) {
					this.error = '';
					if (!u || u.isAnonymous) { this.state = 'signed-out'; return; }
					this.uid = u.uid;
					const db = firebase.database();
					let admin = false;
					try { admin = (await db.ref('admins/' + u.uid).once('value')).val() === true; } catch (e) { admin = false; }
					if (!admin) { this.state = 'denied'; return; }
					try {
						await this.reload();
						this.state = 'ready';
						if (location.hash === '#events') this.openEvents();
						else if (location.hash === '#titles') this.openTitles();
					} catch (e) {
						console.error('[Admin] load failed:', e);
						this.error = 'Could not load the reports: ' + (e.message || e);
						this.state = 'denied';
					}
				},

				async reload() {
					const db = firebase.database();
					// The oldest OPEN_MAX open reports (no `resolved` yet), plus the
					// latest 500 for the All view: a flood of new reports cannot
					// push an older open one out of the queue, and the download
					// stays bounded (each account files one a minute, rules).
					const OPEN_MAX = 500;
					const [openSnap, recentSnap, flagSnap] = await Promise.all([
						db.ref('reports').orderByChild('resolved').equalTo(null).limitToFirst(OPEN_MAX).once('value'),
						db.ref('reports').orderByChild('at').limitToLast(500).once('value'),
						db.ref('user_flags').once('value'),
					]);
					const byId = new Map();
					for (const snap of [openSnap, recentSnap]) {
						snap.forEach((c) => { byId.set(c.key, Object.assign({ id: c.key }, c.val())); });
					}
					this.openTruncated = openSnap.numChildren() >= OPEN_MAX;
					const reports = Array.from(byId.values());
					reports.sort((a, b) => (b.at || 0) - (a.at || 0));
					this.reports = reports;
					this.flags = flagSnap.val() || {};
					for (const r of reports) {
						if (!(r.target in this.banDays)) this.banDays[r.target] = '7';
					}
					const targets = [...new Set(reports.map((r) => r.target).filter(Boolean))];
					const counts = {};
					const COUNT_MAX = 200;
					await Promise.all(targets.map(async (t) => {
						try {
							// Bounded too: past COUNT_MAX the card says "COUNT_MAX+".
							const n = (await db.ref('reports').orderByChild('target').equalTo(t).limitToLast(COUNT_MAX).once('value')).numChildren();
							counts[t] = n >= COUNT_MAX ? COUNT_MAX + '+' : n;
						} catch (e) { counts[t] = reports.filter((r) => r.target === t).length; }
					}));
					this.reportCount = counts;
					const uids = new Set();
					for (const r of reports) { uids.add(r.by); uids.add(r.target); }
					for (const uid of Object.keys(this.flags)) uids.add(uid);
					await Promise.all([...uids].filter((u) => u && !(u in this.names)).map(async (u) => {
						try {
							const n = (await db.ref('users/' + u + '/displayName').once('value')).val();
							this.names[u] = n || u;
						} catch (e) { this.names[u] = u; }
					}));
				},

				nameOf(uid) { return this.names[uid] || uid; },
				flagsOf(uid) { return this.flags[uid] || {}; },
				banned(uid) { const f = this.flags[uid]; return !!(f && typeof f.banUntil === 'number' && f.banUntil > Date.now()); },
				banText(uid) {
					const t = this.flagsOf(uid).banUntil;
					return t >= FOREVER ? 'indefinitely' : 'until ' + new Date(t).toLocaleString();
				},
				reasonText(code) {
					const hit = (window.SigilReport && SigilReport.REASONS || []).find((r) => r[0] === code);
					return hit ? hit[1] : code;
				},
				when(ts) { return ts ? new Date(ts).toLocaleString() : ''; },

				async _write(fn) {
					this.busy = true;
					this.error = '';
					try {
						await fn(firebase.database());
						await this.reload();
					} catch (e) {
						console.error('[Admin] write failed:', e);
						this.error = 'That change was refused: ' + (e.message || e);
					}
					this.busy = false;
				},

				resolve(r) {
					const note = (this.drafts[r.id] || '').trim().slice(0, 1000);
					return this._write((db) => db.ref('reports/' + r.id).update(Object.assign({
						resolved: true,
						resolvedBy: this.uid,
						resolvedAt: firebase.database.ServerValue.TIMESTAMP,
					}, note ? { adminNote: note } : {})));
				},

				ban(target) {
					const d = this.banDays[target] || '7';
					const until = d === 'forever' ? FOREVER : Date.now() + Number(d) * 86400000;
					const reason = (this.banReasons[target] || '').trim().slice(0, 500);
					// update, not set: the abandonment count stays.
					return this._write((db) => db.ref('user_flags/' + target).update({
						banUntil: until,
						reason: reason || null,
						by: this.uid,
						at: firebase.database.ServerValue.TIMESTAMP,
					}));
				},

				// ---- Events and announcements ----

				_localInput(ms) {
					const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000);
					return d.toISOString().slice(0, 16);
				},

				/** Default window: an event in an hour for two hours; an announcement now for a week. */
				evDefaults() {
					const now = Date.now();
					const start = this.ev.kind === 'event' ? Math.ceil((now + 3600000) / 900000) * 900000 : now;
					this.ev.start = this._localInput(start);
					this.ev.end = this._localInput(this.ev.kind === 'event' ? start + 2 * 3600000 : start + 7 * 86400000);
				},

				async openEvents() {
					this.view = 'events';
					try {
						const snap = await firebase.database().ref('site_events').orderByChild('endsAt').limitToLast(100).once('value');
						const list = [];
						snap.forEach((c) => { list.push(Object.assign({ id: c.key }, c.val())); });
						this.siteEvents = list.sort((a, b) => (b.startsAt || 0) - (a.startsAt || 0));
					} catch (e) {
						this.error = 'Could not load events: ' + (e.message || e);
					}
				},

				postEvent() {
					const title = this.ev.title.trim();
					const startsAt = Date.parse(this.ev.start);
					const endsAt = Date.parse(this.ev.end);
					const link = this.ev.link.trim();
					if (!title) { this.error = 'A title is needed.'; return; }
					if (!(startsAt > 0) || !(endsAt > startsAt)) { this.error = 'The end must be after the start.'; return; }
					if (link && !(window.SigilEvents && SigilEvents.safeLink(link))) { this.error = 'The link must start with https:// or be a page of this site (e.g. events.html).'; return; }
					const body = this.ev.body.trim();
					return this._write((db) => db.ref('site_events').push({
						kind: this.ev.kind,
						title: title.slice(0, 120),
						body: body ? body.slice(0, 1000) : null,
						link: link || null,
						startsAt,
						endsAt,
						by: this.uid,
						at: firebase.database.ServerValue.TIMESTAMP,
					})).then(() => {
						if (!this.error) {
							this.ev = { kind: this.ev.kind, title: '', body: '', link: '', start: '', end: '' };
							this.evDefaults();
						}
						return this.openEvents();
					});
				},

				deleteEvent(e) {
					if (!confirm('Delete "' + e.title + '"?')) return;
					return this._write((db) => db.ref('site_events/' + e.id).remove()).then(() => this.openEvents());
				},

				// ---- Verified titles ----

				async openTitles() {
					this.view = 'titles';
					try {
						const db = firebase.database();
						this.titles = (await db.ref('titles').once('value')).val() || {};
						const uids = new Set();
						for (const [u, t] of Object.entries(this.titles)) { uids.add(u); if (t && t.by) uids.add(t.by); }
						await Promise.all([...uids].filter((u) => !(u in this.names)).map(async (u) => {
							try { this.names[u] = (await db.ref('users/' + u + '/displayName').once('value')).val() || u; } catch (e) { this.names[u] = u; }
						}));
					} catch (e) {
						this.error = 'Could not load titles: ' + (e.message || e);
					}
				},

				/** A uid, or a display name claimed in usernames/ (lower case). */
				async _resolvePlayer(who) {
					const db = firebase.database();
					const w = who.trim();
					if (!w) return null;
					if ((await db.ref('users/' + w + '/displayName').once('value')).exists()) return w;
					const key = w.toLowerCase();
					if (/^[a-z0-9_-]{1,20}$/.test(key)) {
						const uid = (await db.ref('usernames/' + key).once('value')).val();
						if (typeof uid === 'string' && uid) return uid;
					}
					return null;
				},

				async grantTitle() {
					this.error = '';
					const title = this.tg.title.trim();
					if (!title) { this.error = 'A title is needed.'; return; }
					let uid = null;
					try { uid = await this._resolvePlayer(this.tg.who); } catch (e) { uid = null; }
					if (!uid) { this.error = 'No player with that name or uid.'; return; }
					await this._write((db) => db.ref('titles/' + uid).set({ title: title.slice(0, 32), by: this.uid, at: firebase.database.ServerValue.TIMESTAMP }));
					if (!this.error) this.tg = { who: '', title: '' };
					return this.openTitles();
				},

				revokeTitle(uid) {
					if (!confirm('Remove ' + this.nameOf(uid) + '\u2019s title?')) return;
					return this._write((db) => db.ref('titles/' + uid).remove()).then(() => this.openTitles());
				},

				lift(target) {
					return this._write((db) => db.ref('user_flags/' + target).update({
						banUntil: 0,
						reason: null,
						by: this.uid,
						at: firebase.database.ServerValue.TIMESTAMP,
					}));
				},
			}));
		});
	</script>

	<script src="https://unpkg.com/alpinejs@3.10.4/dist/cdn.min.js"></script>
</body>
