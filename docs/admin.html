<!DOCTYPE html>
<html class="height:100%" lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex" />
	<link href="static/css/global.css?v202305191" rel="stylesheet" />
	<link href="static/css/layout.css" rel="stylesheet" />
	<link href="static/css/styles.css?v=35" rel="stylesheet" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Arvo&family=Overlock&display=swap" rel="stylesheet" />
	<link href="https://use.typekit.net/rot4udi.css" rel="stylesheet" />
	<script src="static/scripts/theme-manager.js"></script>
	<title>Admin - Sigil Online</title>
	<style>
		body > .main { padding-top: 80px; }
		.admin {
			max-width: 860px;
			margin: 0 auto;
			padding: 24px 16px;
			box-sizing: border-box;
			font-family: 'Overlock', sans-serif;
			color: var(--color-text-warm);
		}
		.admin h2, .admin h3 { font-family: 'Arvo', serif; color: var(--color-text-bright); }
		.admin h2 { font-size: 1.6em; margin-bottom: 8px; }
		.admin h3 { font-size: 1.1em; margin: 24px 0 8px; }
		.admin a { color: var(--color-accent); }
		.admin__msg { color: var(--color-text-dim); font-style: italic; padding: 12px 0; }
		.admin__tabs { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
		.admin__tab, .admin__btn {
			background: rgba(255, 255, 255, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.4);
			border-radius: 6px;
			color: var(--color-text-warm);
			cursor: pointer;
			font-family: inherit;
			font-size: 0.9em;
			padding: 6px 12px;
		}
		.admin__tab--active { background: var(--color-surface-hover); border-color: var(--color-accent); }
		.admin__btn:hover, .admin__tab:hover { background: rgba(255, 255, 255, 0.2); }
		.admin__btn--danger { background: var(--color-btn-reset); border-color: var(--color-btn-reset); color: #fff; }
		.admin__btn:disabled { opacity: 0.5; cursor: default; }
		.report-card {
			background: var(--color-surface);
			border-left: 4px solid var(--color-error);
			border-radius: 8px;
			margin-bottom: 12px;
			padding: 12px 16px;
			overflow-wrap: anywhere;
		}
		.report-card--resolved { border-left-color: var(--color-success); opacity: 0.8; }
		.report-card__head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
		.report-card__reason { font-weight: bold; color: var(--color-text-bright); text-transform: capitalize; }
		.report-card__meta { color: var(--color-text-dim); font-size: 0.85em; }
		.report-card__note { margin: 8px 0; white-space: pre-wrap; }
		.report-card__flags { font-size: 0.9em; color: var(--color-text-dim); margin: 6px 0; }
		.report-card__flags strong { color: var(--color-error); }
		.report-card__controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
		.report-card textarea, .report-card select, .report-card input {
			background: var(--color-bg-mid);
			border: 1px solid var(--color-border);
			border-radius: 6px;
			box-sizing: border-box;
			color: var(--color-text);
			font-family: inherit;
			font-size: 0.9em;
			padding: 6px;
		}
		.report-card textarea { width: 100%; margin-top: 8px; }
		.report-card input { flex: 1 1 160px; min-width: 0; }
		.flags-table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
		.flags-table th, .flags-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--color-bg-mid); }
		.flags-table th { color: var(--color-text-dim); font-family: 'Arvo', serif; font-size: 0.8em; text-transform: uppercase; }
		.flags-wrap { overflow-x: auto; }
		.report-card--appeal { border-left-color: var(--color-accent); }
		.report-card__games { margin: 6px 0; padding-left: 20px; font-size: 0.9em; }
		.scan__note {
			background: rgba(230, 102, 102, 0.12);
			border: 1px solid var(--color-error);
			border-radius: 8px;
			margin: 8px 0 12px;
			padding: 10px 14px;
		}
		.scan__meta { color: var(--color-text-dim); font-size: 0.9em; margin: 4px 0; overflow-wrap: anywhere; }
		.scan__controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
		.scan__controls input[type="file"] { color: var(--color-text-warm); font-family: inherit; max-width: 100%; }
		.scan-card { border-left-color: var(--color-border); }
		.scan-card--strong { border-left-color: var(--color-error); }
		.scan-card--review { border-left-color: var(--color-btn-dash-hover); }
		.scan-card--anchor { border-left-color: var(--color-accent); }
		.scan-card__flag { font-family: 'Arvo', serif; font-size: 0.8em; text-transform: uppercase; color: var(--color-text-dim); }
		.scan-card--strong .scan-card__flag { color: var(--color-error); }
		.scan-card__stats { margin: 6px 0; font-size: 0.95em; }
		.scan-card__why { margin: 4px 0; padding-left: 20px; font-size: 0.9em; }
		.scan-card details { font-size: 0.9em; }
		.scan-card summary { cursor: pointer; color: var(--color-accent); }
	</style>
</head>
<body>
	<header>
		<div class="container">
			<div class="header-container">
				<div>
					<h1 class="logo"><a href="./"><span class="visually-hidden">Sigil Online</span><img alt="" src="static/images/logo-icon.svg" height="40" width="32" /></a></h1>
				</div>
				<h1></h1>
				<div id="auth-status"></div>
			</div>
		</div>
	</header>

	<div class="main" x-data="adminPage()">
		<div class="admin">
			<h2>Admin</h2>
			<p class="admin__msg" x-show="state === 'loading'">Loading...</p>
			<p class="admin__msg" x-show="state === 'signed-out'" x-cloak>Sign in on the <a href="account.html">account page</a> first.</p>
			<p class="admin__msg" x-show="state === 'denied'" x-cloak data-testid="admin-denied">This page is for site admins. (An admin is added by hand at admins/{uid} in the database.)</p>
			<p class="admin__msg" x-show="error" x-cloak x-text="error"></p>

			<template x-if="state === 'ready'">
				<div>
					<div class="admin__tabs" role="tablist">
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'open' }" x-on:click="view = 'open'" x-text="'Open reports (' + openCount + (openTruncated ? '+, oldest shown' : '') + ')'"></button>
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'all' }" x-on:click="view = 'all'" x-text="'All reports (' + reports.length + ')'"></button>
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'appeals' }" x-on:click="view = 'appeals'" x-text="'Appeals (' + openAppeals + ')'" data-testid="tab-appeals"></button>
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'players' }" x-on:click="view = 'players'">Suspensions, abandons, stalls</button>
						<button class="admin__tab" role="tab" x-bind:class="{ 'admin__tab--active': view === 'scan' }" x-on:click="openScan()" data-testid="tab-scan">Engine scan</button>
					</div>

					<template x-if="view === 'open' || view === 'all'">
						<div>
							<p class="admin__msg" x-show="shownReports.length === 0">No reports here.</p>
							<template x-for="r in shownReports" x-bind:key="r.id">
								<div class="report-card" x-bind:class="{ 'report-card--resolved': r.resolved }" data-testid="report-card">
									<div class="report-card__head">
										<span class="report-card__reason" x-text="reasonText(r.reason)"></span>
										<span>against <a x-bind:href="'profile.html?uid=' + encodeURIComponent(r.target)" x-text="nameOf(r.target)" data-testid="report-target"></a></span>
										<span class="report-card__meta">by <a x-bind:href="'profile.html?uid=' + encodeURIComponent(r.by)" x-text="nameOf(r.by)"></a> &middot; <span x-text="when(r.at)"></span></span>
										<template x-if="r.room"><span class="report-card__meta">game <a x-bind:href="'multiplayer.html?id=' + encodeURIComponent(r.room)" x-text="r.room"></a></span></template>
									</div>
									<p class="report-card__note" x-show="r.note" x-text="r.note"></p>
									<p class="report-card__flags">
										<span x-text="(flagsOf(r.target).abandons || 0) + ' upheld abandonment' + ((flagsOf(r.target).abandons || 0) === 1 ? '' : 's')"></span>
										&middot; <span x-text="(reportCount[r.target] || 0) + ' report(s) in all'"></span>
										<template x-if="banned(r.target)"><span> &middot; <strong x-text="'Suspended ' + banText(r.target)"></strong></span></template>
									</p>
									<template x-if="r.resolved">
										<p class="report-card__meta">Resolved<span x-show="r.resolvedAt" x-text="' ' + when(r.resolvedAt)"></span><span x-show="r.adminNote" x-text="': ' + r.adminNote"></span></p>
									</template>
									<template x-if="!r.resolved">
										<div>
											<textarea rows="2" maxlength="1000" placeholder="Admin note (kept with the report)" x-model="drafts[r.id]"></textarea>
											<div class="report-card__controls">
												<button class="admin__btn" x-on:click="resolve(r)" x-bind:disabled="busy" data-testid="resolve">Mark resolved</button>
												<select x-model="banDays[r.target]" aria-label="Suspension length">
													<option value="1">1 day</option>
													<option value="7">7 days</option>
													<option value="30">30 days</option>
													<option value="forever">Indefinitely</option>
												</select>
												<input type="text" maxlength="500" placeholder="Reason shown to the player" x-model="banReasons[r.target]" aria-label="Suspension reason" />
												<button class="admin__btn admin__btn--danger" x-on:click="ban(r.target)" x-bind:disabled="busy" data-testid="ban">Suspend from rated play</button>
												<button class="admin__btn" x-show="banned(r.target)" x-on:click="lift(r.target)" x-bind:disabled="busy">Lift suspension</button>
											</div>
										</div>
									</template>
								</div>
							</template>
						</div>
					</template>

					<template x-if="view === 'players'">
						<div>
							<p class="admin__msg" x-show="flagRows.length === 0">No suspensions, abandonments or stalls recorded.</p>
							<div class="flags-wrap">
							<table class="flags-table" x-show="flagRows.length > 0">
								<thead><tr><th>Player</th><th>Abandons</th><th>Stalls</th><th>Last 30 days</th><th>Suspension</th><th></th></tr></thead>
								<tbody>
									<template x-for="f in flagRows" x-bind:key="f.uid">
										<tr>
											<td><a x-bind:href="'profile.html?uid=' + encodeURIComponent(f.uid)" x-text="nameOf(f.uid)"></a></td>
											<td x-text="f.abandons || 0"></td>
											<td x-text="f.stalls || 0"></td>
											<td x-text="recentCount(f.uid)"></td>
											<td><span x-text="banned(f.uid) ? banText(f.uid) : 'none'"></span><span x-show="banned(f.uid) && f.auto === true" x-text="' (automatic)'"></span><span x-show="f.reason && banned(f.uid)" x-text="' (' + f.reason + ')'"></span></td>
											<td><button class="admin__btn" x-show="banned(f.uid)" x-on:click="lift(f.uid)" x-bind:disabled="busy">Lift</button></td>
										</tr>
									</template>
								</tbody>
							</table>
							</div>
						</div>
					</template>

					<!-- Appeals (appeals/{uid}): one per suspension, filed on the
					     account page; decided once. Lifting an automatic suspension
					     overturns it (it no longer raises the next one's level) and
					     can forgive the games behind it. -->
					<template x-if="view === 'appeals'">
						<div>
							<p class="admin__msg" x-show="appeals.length === 0">No appeals.</p>
							<template x-for="a in appeals" x-bind:key="a.uid + ':' + a.at">
								<div class="report-card report-card--appeal" x-bind:class="{ 'report-card--resolved': a.status !== 'open' }" data-testid="appeal-card">
									<div class="report-card__head">
										<span class="report-card__reason">Appeal</span>
										<span>by <a x-bind:href="'profile.html?uid=' + encodeURIComponent(a.uid)" x-text="nameOf(a.uid)" data-testid="appeal-player"></a></span>
										<span class="report-card__meta" x-text="when(a.at)"></span>
									</div>
									<p class="report-card__note" x-text="a.text"></p>
									<p class="report-card__flags">
										<template x-if="banned(a.uid)"><strong x-text="'Suspended ' + banText(a.uid) + (flagsOf(a.uid).auto === true ? ' (automatic)' : '')"></strong></template>
										<template x-if="!banned(a.uid)"><span>No suspension running now.</span></template>
										<span x-show="flagsOf(a.uid).reason" x-text="' ' + flagsOf(a.uid).reason"></span>
										<span x-show="a.banAt !== flagsOf(a.uid).at && a.status === 'open'"> (the suspension appealed has since been changed)</span>
									</p>
									<template x-if="restrictionGames(a.uid).length">
										<ul class="report-card__games">
											<template x-for="o in restrictionGames(a.uid)" x-bind:key="o.room">
												<li><a x-bind:href="'multiplayer.html?id=' + encodeURIComponent(o.room)" x-text="o.room"></a>: <span x-text="offenseText(o)"></span></li>
											</template>
										</ul>
									</template>
									<p class="report-card__flags" x-text="(flagsOf(a.uid).abandons || 0) + ' abandoned, ' + (flagsOf(a.uid).stalls || 0) + ' stalled in all; ' + recentCount(a.uid) + ' in the last 30 days'"></p>
									<template x-if="a.status !== 'open'">
										<p class="report-card__meta" x-text="'Decided: ' + a.status + (a.resolvedAt ? ' ' + when(a.resolvedAt) : '') + (a.adminNote ? ': ' + a.adminNote : '')"></p>
									</template>
									<template x-if="a.status === 'open'">
										<div>
											<textarea rows="2" maxlength="1000" placeholder="Note to the player (shown on their account page)" x-model="appealNotes[a.uid]" data-testid="appeal-note"></textarea>
											<div class="report-card__controls">
												<button class="admin__btn" x-on:click="decideAppeal(a, 'lifted')" x-bind:disabled="busy" data-testid="appeal-lift">Lift suspension</button>
												<label x-show="flagsOf(a.uid).auto === true"><input type="checkbox" x-model="appealForgive[a.uid]" /> forgive its games</label>
												<button class="admin__btn" x-on:click="decideAppeal(a, 'kept')" x-bind:disabled="busy" data-testid="appeal-keep">Keep</button>
												<select x-model="appealExtend[a.uid]" aria-label="Extend by">
													<option value="1">1 day</option>
													<option value="7">7 days</option>
													<option value="30">30 days</option>
												</select>
												<button class="admin__btn admin__btn--danger" x-on:click="decideAppeal(a, 'extended')" x-bind:disabled="busy" data-testid="appeal-extend">Extend</button>
											</div>
										</div>
									</template>
								</div>
							</template>
						</div>
					</template>

					<!-- The engine-correlation scan (engine/harness/fair_play_scan.py):
					     the latest report Robi published to fairplay_reports/, or a
					     report file opened here (read in this browser only). -->
					<template x-if="view === 'scan'">
						<div>
							<div class="scan__note"><strong>For human review only.</strong> A flag means: open the games and look. Never suspend on a flag alone; strong players agree with the engine more, and a short sample is noisy.</div>
							<div class="scan__controls">
								<button class="admin__btn" x-on:click="loadScan()" x-bind:disabled="busy">Latest from the database</button>
								<label>Open a report file <input type="file" accept=".json,application/json" x-on:change="openScanFile($event)" data-testid="scan-file" /></label>
								<label><input type="checkbox" x-model="scanAll" /> show unflagged players</label>
							</div>
							<p class="admin__msg" x-show="!scan && !scanError">No scan report yet. Robi runs engine/harness/fair_play_scan.py (see its header) and either publishes the report or sends the file.</p>
							<p class="admin__msg" x-show="scanError" x-text="scanError"></p>
							<template x-if="scan">
								<div data-testid="scan-report">
									<p class="scan__meta" x-text="'Report ' + (scan.run || '') + (scanSource ? ' (' + scanSource + ')' : '') + ': ' + when(scan.generatedAt) + ' · engine ' + (scan.engine || '?') + ' · depth ' + (scan.depth || '?') + ' · ' + ((scan.source || {}).games || 0) + ' games, ' + (scan.players || []).length + ' players'"></p>
									<p class="scan__meta" x-text="scanCounts"></p>
									<p class="admin__msg" x-show="scanShown.length === 0">No flagged players in this report.</p>
									<template x-for="p in scanShown" x-bind:key="p.uid">
										<div class="report-card scan-card" x-bind:class="'scan-card--' + p.flag" data-testid="scan-card">
											<div class="report-card__head">
												<span class="scan-card__flag" x-text="p.flag"></span>
												<a x-bind:href="'profile.html?uid=' + encodeURIComponent(p.uid)" x-text="nameOf(p.uid)" data-testid="scan-player"></a>
												<span class="report-card__meta" x-text="'rating ' + (p.rating === null ? '?' : Math.round(p.rating)) + ' · ' + p.games + ' games, ' + p.turns + ' turns'"></span>
											</div>
											<p class="scan-card__stats" x-text="statLine(p, 't1')"></p>
											<p class="scan-card__stats" x-text="statLine(p, 'acpl')"></p>
											<template x-if="p.why && p.why.length">
												<ul class="scan-card__why"><template x-for="w in p.why" x-bind:key="w"><li x-text="w"></li></template></ul>
											</template>
											<details>
												<summary x-text="'Games (' + (p.gameList || []).length + ')'"></summary>
												<ul class="report-card__games">
													<template x-for="g in (p.gameList || [])" x-bind:key="g.gameId">
														<li>
															<template x-if="g.roomCode"><a x-bind:href="'multiplayer.html?id=' + encodeURIComponent(g.roomCode)" x-text="g.roomCode"></a></template>
															<template x-if="!g.roomCode"><span x-text="g.gameId"></span></template>
															<span x-text="' ' + (g.timestamp ? when(g.timestamp) : '') + ', ' + g.color + ' vs ' + nameOf(g.opponentUid) + ': match ' + pct(g.t1) + ', loss ' + g.acpl + ' (' + g.turns + ' turns)'"></span>
														</li>
													</template>
												</ul>
											</details>
										</div>
									</template>
									<template x-if="(scan.anchors || []).length">
										<div>
											<h3>The site's AI on the same measures</h3>
											<template x-for="p in scan.anchors" x-bind:key="p.uid">
												<div class="report-card scan-card scan-card--anchor">
													<div class="report-card__head"><span x-text="nameOf(p.uid)"></span><span class="report-card__meta" x-text="p.games + ' games, ' + p.turns + ' turns'"></span></div>
													<p class="scan-card__stats" x-text="statLine(p, 't1')"></p>
													<p class="scan-card__stats" x-text="statLine(p, 'acpl')"></p>
												</div>
											</template>
										</div>
									</template>
								</div>
							</template>
						</div>
					</template>
				</div>
			</template>
		</div>
	</div>

	<!-- Firebase SDK -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
	<script>
		firebase.initializeApp({
			apiKey: "AIzaSyDcYsA9GxotScZ6m92B_TDSArkeN1qMHvE",
			authDomain: "sigil-js.firebaseapp.com",
			databaseURL: "https://sigil-js-default-rtdb.firebaseio.com",
			projectId: "sigil-js",
			storageBucket: "sigil-js.firebasestorage.app",
			messagingSenderId: "174679859896",
			appId: "1:174679859896:web:9f8e5ddc4388ae73a60a4d"
		});
	</script>
	<script src="static/scripts/auth-status.js?v=35"></script>
	<script src="static/scripts/report-dialog.js?v=35"></script>
	<script src="static/scripts/engine/fair-play.js?v=35"></script>

	<script>
		// Reports (reports/), suspensions and the abandoned and stalled games
		// behind them (user_flags/), appeals (appeals/) and the engine scan
		// (fairplay_reports/). The rules let only admins (admins/{uid} ===
		// true) read them or write user_flags; a report's or an appeal's own
		// fields stay as filed, and the server's record of offenses can only
		// be forgiven, never edited.
		document.addEventListener('alpine:init', () => {
			// A suspension "indefinitely": far enough out to be permanent.
			const FOREVER = Date.UTC(2200, 0, 1);
			Alpine.data('adminPage', () => ({
				state: 'loading',
				error: '',
				busy: false,
				uid: null,
				view: 'open',
				reports: [],
				flags: {},
				names: {},
				drafts: {},
				banDays: {},
				banReasons: {},
				appeals: [],
				appealNotes: {},
				appealForgive: {},
				appealExtend: {},
				scan: null,
				scanSource: '',
				scanError: '',
				scanAll: false,
				scanLoaded: false,

				get openAppeals() { return this.appeals.filter((a) => a.status === 'open').length; },
				get scanShown() {
					const ps = (this.scan && this.scan.players) || [];
					return this.scanAll ? ps : ps.filter((p) => p.flag === 'strong' || p.flag === 'review');
				},
				get scanCounts() {
					const c = {};
					for (const p of (this.scan && this.scan.players) || []) c[p.flag] = (c[p.flag] || 0) + 1;
					return ['strong', 'review', 'none', 'insufficient'].map((k) => (c[k] || 0) + ' ' + k).join(' · ');
				},

				get openCount() { return this.reports.filter((r) => !r.resolved).length; },
				get shownReports() { return this.view === 'open' ? this.reports.filter((r) => !r.resolved) : this.reports; },
				// Every report on each target, counted by query: the loaded
				// window (open + latest 500) may not hold them all.
				reportCount: {},
				// More open reports than the queue loads (reload).
				openTruncated: false,
				get flagRows() {
					return Object.keys(this.flags).map((uid) => Object.assign({ uid }, this.flags[uid]))
						.filter((f) => f.abandons > 0 || f.stalls > 0 || typeof f.banUntil === 'number')
						.sort((a, b) => (this.banned(b.uid) - this.banned(a.uid)) || ((b.abandons || 0) - (a.abandons || 0)));
				},

				init() {
					firebase.auth().onAuthStateChanged((u) => this._start(u));
				},

				async _start(u) {
					this.error = '';
					if (!u || u.isAnonymous) { this.state = 'signed-out'; return; }
					this.uid = u.uid;
					const db = firebase.database();
					let admin = false;
					try { admin = (await db.ref('admins/' + u.uid).once('value')).val() === true; } catch (e) { admin = false; }
					if (!admin) { this.state = 'denied'; return; }
					try {
						await this.reload();
						this.state = 'ready';
					} catch (e) {
						console.error('[Admin] load failed:', e);
						this.error = 'Could not load the reports: ' + (e.message || e);
						this.state = 'denied';
					}
				},

				async reload() {
					const db = firebase.database();
					// The oldest OPEN_MAX open reports (no `resolved` yet), plus the
					// latest 500 for the All view: a flood of new reports cannot
					// push an older open one out of the queue, and the download
					// stays bounded (each account files one a minute, rules).
					const OPEN_MAX = 500;
					const [openSnap, recentSnap, flagSnap, appealOpenSnap, appealRecentSnap] = await Promise.all([
						db.ref('reports').orderByChild('resolved').equalTo(null).limitToFirst(OPEN_MAX).once('value'),
						db.ref('reports').orderByChild('at').limitToLast(500).once('value'),
						db.ref('user_flags').once('value'),
						// Every open appeal (one per player), and the latest decided.
						db.ref('appeals').orderByChild('status').equalTo('open').once('value'),
						db.ref('appeals').orderByChild('at').limitToLast(50).once('value'),
					]);
					const appeals = new Map();
					for (const snap of [appealOpenSnap, appealRecentSnap]) {
						snap.forEach((c) => { appeals.set(c.key, Object.assign({ uid: c.key }, c.val())); });
					}
					// Open first (oldest first), then the decided, newest first.
					this.appeals = Array.from(appeals.values()).sort((a, b) => ((a.status === 'open') === (b.status === 'open')
						? (a.status === 'open' ? a.at - b.at : b.at - a.at) : (a.status === 'open' ? -1 : 1)));
					for (const a of this.appeals) {
						if (!(a.uid in this.appealExtend)) this.appealExtend[a.uid] = '7';
						if (!(a.uid in this.appealForgive)) this.appealForgive[a.uid] = true;
					}
					const byId = new Map();
					for (const snap of [openSnap, recentSnap]) {
						snap.forEach((c) => { byId.set(c.key, Object.assign({ id: c.key }, c.val())); });
					}
					this.openTruncated = openSnap.numChildren() >= OPEN_MAX;
					const reports = Array.from(byId.values());
					reports.sort((a, b) => (b.at || 0) - (a.at || 0));
					this.reports = reports;
					this.flags = flagSnap.val() || {};
					for (const r of reports) {
						if (!(r.target in this.banDays)) this.banDays[r.target] = '7';
					}
					const targets = [...new Set(reports.map((r) => r.target).filter(Boolean))];
					const counts = {};
					const COUNT_MAX = 200;
					await Promise.all(targets.map(async (t) => {
						try {
							// Bounded too: past COUNT_MAX the card says "COUNT_MAX+".
							const n = (await db.ref('reports').orderByChild('target').equalTo(t).limitToLast(COUNT_MAX).once('value')).numChildren();
							counts[t] = n >= COUNT_MAX ? COUNT_MAX + '+' : n;
						} catch (e) { counts[t] = reports.filter((r) => r.target === t).length; }
					}));
					this.reportCount = counts;
					const uids = new Set();
					for (const r of reports) { uids.add(r.by); uids.add(r.target); }
					for (const uid of Object.keys(this.flags)) uids.add(uid);
					for (const a of this.appeals) uids.add(a.uid);
					await this._names(uids);
				},

				async _names(uids) {
					const db = firebase.database();
					await Promise.all([...uids].filter((u) => typeof u === 'string' && u && !(u in this.names)).map(async (u) => {
						try {
							const n = (await db.ref('users/' + u + '/displayName').once('value')).val();
							this.names[u] = n || u;
						} catch (e) { this.names[u] = u; }
					}));
				},

				nameOf(uid) { return this.names[uid] || uid || '?'; },
				flagsOf(uid) { return this.flags[uid] || {}; },
				banned(uid) { const f = this.flags[uid]; return !!(f && typeof f.banUntil === 'number' && f.banUntil > Date.now()); },
				banText(uid) {
					const t = this.flagsOf(uid).banUntil;
					return t >= FOREVER ? 'indefinitely' : 'until ' + new Date(t).toLocaleString();
				},
				recentCount(uid) {
					return typeof fairPlayRecentOffenses === 'function' ? fairPlayRecentOffenses(this.flagsOf(uid), Date.now()).length : 0;
				},
				// The automatic suspension running now (its record has the
				// suspension's own `at`), or null.
				currentRestriction(uid) {
					const f = this.flagsOf(uid);
					if (f.auto !== true || !f.restrictions) return null;
					const key = Object.keys(f.restrictions).find((k) => f.restrictions[k] && f.restrictions[k].at === f.at);
					return key ? Object.assign({ key }, f.restrictions[key]) : null;
				},
				restrictionGames(uid) {
					const r = this.currentRestriction(uid);
					const offenses = this.flagsOf(uid).offenses || {};
					return r && r.rooms ? Object.keys(r.rooms).map((room) => Object.assign({ room, kind: r.rooms[room] }, offenses[room] || {})) : [];
				},
				offenseText(o) {
					const at = typeof o.at === 'number' ? ', ' + this.when(o.at) : '';
					if (o.kind === 'stall') {
						return 'stalled' + (typeof o.leftMs === 'number'
							? ' (sat ' + Math.round((o.satMs || 0) / 1000) + ' s with ' + Math.round(o.leftMs / 1000) + ' s left; median turn ' + Math.round((o.medianMs || 0) / 1000) + ' s over ' + (o.turns || 0) + ' turns)'
							: '') + at + (o.forgiven ? ', forgiven' : '');
					}
					return 'abandoned (claim upheld)' + at + (o.forgiven ? ', forgiven' : '');
				},
				pct(x) { return typeof x === 'number' ? Math.round(x * 100) + '%' : '?'; },
				statLine(p, key) {
					const v = p[key] || {};
					const peers = p.peers || null;
					if (key === 't1') {
						return 'Engine match ' + this.pct(v.est) + ' [' + this.pct(v.lo) + ', ' + this.pct(v.hi) + ']'
							+ (peers && peers.t1 ? ' · peers (' + peers.n + ' within ' + peers.band + '): mean ' + this.pct(peers.t1.mean) + ', 95th pct ' + this.pct(peers.t1.p95) : '')
							+ (p.z && typeof p.z.t1 === 'number' ? ' · z ' + p.z.t1 : '');
					}
					const f = (x) => (typeof x === 'number' ? x.toFixed(1) : '?');
					return 'Average loss ' + f(v.est) + ' [' + f(v.lo) + ', ' + f(v.hi) + '] centistones'
						+ (peers && peers.acpl ? ' · peers: mean ' + f(peers.acpl.mean) + ', 5th pct ' + f(peers.acpl.p05) : '')
						+ (p.z && typeof p.z.acpl === 'number' ? ' · z ' + p.z.acpl : '');
				},
				reasonText(code) {
					const hit = (window.SigilReport && SigilReport.REASONS || []).find((r) => r[0] === code);
					return hit ? hit[1] : code;
				},
				when(ts) { return ts ? new Date(ts).toLocaleString() : ''; },

				async _write(fn) {
					this.busy = true;
					this.error = '';
					try {
						await fn(firebase.database());
						await this.reload();
					} catch (e) {
						console.error('[Admin] write failed:', e);
						this.error = 'That change was refused: ' + (e.message || e);
					}
					this.busy = false;
				},

				resolve(r) {
					const note = (this.drafts[r.id] || '').trim().slice(0, 1000);
					return this._write((db) => db.ref('reports/' + r.id).update(Object.assign({
						resolved: true,
						resolvedBy: this.uid,
						resolvedAt: firebase.database.ServerValue.TIMESTAMP,
					}, note ? { adminNote: note } : {})));
				},

				ban(target) {
					const d = this.banDays[target] || '7';
					const until = d === 'forever' ? FOREVER : Date.now() + Number(d) * 86400000;
					const reason = (this.banReasons[target] || '').trim().slice(0, 500);
					// update, not set: the abandonment count stays. An admin's
					// suspension is not automatic (`auto` cleared).
					return this._write((db) => db.ref('user_flags/' + target).update({
						banUntil: until,
						reason: reason || null,
						auto: null,
						by: this.uid,
						at: firebase.database.ServerValue.TIMESTAMP,
					}));
				},

				lift(target) {
					return this._write((db) => db.ref('user_flags/' + target).update({
						banUntil: 0,
						reason: null,
						auto: null,
						by: this.uid,
						at: firebase.database.ServerValue.TIMESTAMP,
					}));
				},

				// One atomic write: the appeal's decision, and the suspension
				// lifted (an automatic one overturned, its games forgiven when
				// ticked), kept, or extended from its current end.
				decideAppeal(a, status) {
					const TS = firebase.database.ServerValue.TIMESTAMP;
					const uid = a.uid;
					const f = this.flagsOf(uid);
					const ap = 'appeals/' + uid + '/';
					const fl = 'user_flags/' + uid + '/';
					const note = (this.appealNotes[uid] || '').trim().slice(0, 1000);
					const u = { [ap + 'status']: status, [ap + 'resolvedBy']: this.uid, [ap + 'resolvedAt']: TS };
					if (note) u[ap + 'adminNote'] = note;
					const running = typeof f.banUntil === 'number' && f.banUntil > Date.now() ? f.banUntil : 0;
					if (status === 'lifted') {
						const r = this.currentRestriction(uid);
						if (r) {
							u[fl + 'restrictions/' + r.key + '/overturned'] = true;
							u[fl + 'restrictions/' + r.key + '/overturnedBy'] = this.uid;
							u[fl + 'restrictions/' + r.key + '/overturnedAt'] = TS;
							if (this.appealForgive[uid]) {
								for (const room of Object.keys(r.rooms || {})) {
									if ((f.offenses || {})[room]) u[fl + 'offenses/' + room + '/forgiven'] = true;
								}
							}
						}
						Object.assign(u, { [fl + 'banUntil']: 0, [fl + 'reason']: null, [fl + 'auto']: null, [fl + 'by']: this.uid, [fl + 'at']: TS });
						u[ap + 'until'] = 0;
					} else if (status === 'extended') {
						// From the current end (or now): `at` and `by` stay, so this
						// suspension is not appealed again.
						const until = Math.max(running, Date.now()) + Number(this.appealExtend[uid] || 7) * 86400000;
						u[fl + 'banUntil'] = until;
						u[ap + 'until'] = until;
					} else if (running) {
						u[ap + 'until'] = running;
					}
					return this._write((db) => db.ref().update(u));
				},

				async openScan() {
					this.view = 'scan';
					if (!this.scanLoaded) await this.loadScan();
				},

				async loadScan() {
					this.scanError = '';
					this.scanLoaded = true;
					try {
						const snap = await firebase.database().ref('fairplay_reports').orderByKey().limitToLast(1).once('value');
						let rep = null;
						snap.forEach((c) => { rep = c.val(); });
						if (rep) await this._showScan(rep, 'database');
					} catch (e) {
						console.error('[Admin] scan load failed:', e);
						this.scanError = 'Could not load the scan reports: ' + (e.message || e);
					}
				},

				openScanFile(ev) {
					const file = ev.target.files && ev.target.files[0];
					if (!file) return;
					this.scanError = '';
					const reader = new FileReader();
					reader.onload = () => {
						try {
							const rep = JSON.parse(reader.result);
							if (!rep || rep.version !== 1 || !Array.isArray(rep.players)) throw new Error('not a fair_play_scan.py report (version 1)');
							this._showScan(rep, file.name);
						} catch (e) {
							this.scanError = 'That file is not a scan report: ' + (e.message || e);
						}
					};
					reader.readAsText(file);
				},

				async _showScan(rep, source) {
					// The database turns arrays with gaps into objects: back to lists.
					const list = (x) => (Array.isArray(x) ? x : x && typeof x === 'object' ? Object.values(x) : []);
					rep.players = list(rep.players).map((p) => Object.assign(p, { why: list(p.why), gameList: list(p.gameList) }));
					rep.anchors = list(rep.anchors);
					this.scan = rep;
					this.scanSource = source;
					const uids = new Set();
					for (const p of rep.players.concat(rep.anchors)) {
						uids.add(p.uid);
						for (const g of p.gameList || []) uids.add(g.opponentUid);
					}
					await this._names(uids);
				},
			}));
		});
	</script>
