		<title>Puzzles - Sigil Online</title>
		<style>
			header { position: absolute; }
			body > .main { padding-top: 0px; }

			.puzzle-panel {
				font-family: 'Overlock', sans-serif;
				color: var(--color-text-warm, #eee);
				padding: 56px 0 8px;
			}
			.puzzle-panel__title {
				font-family: 'Arvo', serif;
				font-size: 1.35em;
				margin: 0 0 2px;
			}
			.puzzle-panel__title--red { color: #e0604a; }
			.puzzle-panel__title--blue { color: #5aa0e6; }
			.puzzle-panel__sub {
				color: var(--color-text-muted, #aaa);
				font-size: 0.9em;
				margin: 0 0 8px;
			}
			.puzzle-panel__status {
				min-height: 1.4em;
				font-size: 1.05em;
				margin: 6px 0;
			}
			.puzzle-panel__status--solved { color: #6fd46f; font-weight: bold; }
			.puzzle-panel__status--failed { color: #e0604a; }
			.puzzle-panel__diag {
				margin: 6px 0;
				padding: 8px 10px;
				border: 1px solid #c9a227;
				border-radius: 6px;
				background: rgba(201, 162, 39, 0.12);
				color: #f0d77a;
				font-size: 0.85em;
				word-break: break-all;
			}
			.puzzle-panel__solution {
				margin: 8px 0;
				padding: 10px 12px;
				border-radius: 6px;
				border: 1px solid #d4af37;
				background: rgba(212, 175, 55, 0.12);
				font-size: 1.02em;
			}
			.puzzle-panel__solution strong { color: #f0d77a; }
			/* The revealed solution's nodes: a pulsing gold ring, distinct from the
			   red/blue legal-move rings the game itself draws. */
			.stone-node--solution::after {
				content: '';
				position: absolute; inset: -6px;
				border: 3px solid #f0d77a;
				border-radius: 50%;
				box-shadow: 0 0 10px 3px rgba(240, 215, 122, 0.8);
				animation: puzzle-solution-pulse 1s ease-in-out infinite alternate;
				pointer-events: none;
			}
			@keyframes puzzle-solution-pulse { from { opacity: 0.45; } to { opacity: 1; } }
			.puzzle-panel__solution li { margin: 2px 0 2px 1em; }
			.puzzle-panel__nav {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin: 10px 0 4px;
			}
			.puzzle-panel__nav .action-button { margin: 0; }
			.puzzle-panel__progress {
				color: var(--color-text-muted, #aaa);
				font-size: 0.85em;
				margin-top: 6px;
			}
			.puzzle-panel__filter a { color: inherit; margin-right: 10px; }
			.puzzle-panel__filter a.is-active { font-weight: bold; text-decoration: underline; }
			.puzzle-loading { padding: 80px 0; text-align: center; color: var(--color-text-muted, #aaa); }
		</style>

			var webpDetector = new Image();
			webpDetector.onload = function () { document.documentElement.classList.add('webp'); };
			webpDetector.src = 'data:image/webp;base64,UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoBAAEAAwA0JaQAA3AA/vuUAAA=';

		<script>
			/**
			 * Puzzle selection. The set is a static JSON generated offline by
			 * tools/gen_mate_puzzles.py (exhaustive Rust solver over recorded
			 * games). URL: ?p=<index> picks a puzzle, ?mate=1|2 filters, and with
			 * neither the first unsolved puzzle (localStorage progress) is shown.
			 */
			(async function boot() {
				const params = new URLSearchParams(window.location.search);
				let data;
				try {
					const res = await fetch('static/puzzles/mate_puzzles.json', { cache: 'no-cache' });
					if (!res.ok) throw new Error('HTTP ' + res.status);
					data = await res.json();
				} catch (e) {
					document.getElementById('puzzle-loading').textContent = 'Could not load the puzzle set (' + (e.message || e) + ').';
					return;
				}
				const all = data.puzzles || [];
				const mateFilter = ['1', '2', '3'].includes(params.get('mate')) ? parseInt(params.get('mate'), 10) : null;
				const pool = mateFilter ? all.filter(p => p.mate === mateFilter) : all;
				if (!pool.length) {
					document.getElementById('puzzle-loading').textContent = 'No puzzles available yet.';
					return;
				}
				let solved = {};
				try { solved = JSON.parse(localStorage.getItem('sigil_puzzles_solved') || '{}') || {}; } catch (e) { solved = {}; }

				// Position within the filtered pool.
				let pos = -1;
				if (params.has('p')) {
					const idx = parseInt(params.get('p'), 10);
					pos = pool.findIndex(p => p.index === idx);
				} else if (params.has('id')) {
					pos = pool.findIndex(p => p.id === params.get('id'));
				}
				if (pos < 0) {
					pos = pool.findIndex(p => !solved[p.id]);
					if (pos < 0) pos = 0;
				}
				const puzzle = pool[pos];
				const link = (p) => 'puzzles.html?p=' + p.index + (mateFilter ? '&mate=' + mateFilter : '');
				const randomOther = () => {
					if (pool.length < 2) return puzzle;
					let r = puzzle;
					while (r === puzzle) r = pool[Math.floor(Math.random() * pool.length)];
					return r;
				};
				window.SIGIL_PUZZLE = puzzle;
				window.SIGIL_PUZZLE_NAV = {
					prev: pos > 0 ? link(pool[pos - 1]) : '',
					next: pos < pool.length - 1 ? link(pool[pos + 1]) : '',
					random: link(randomOther()),
				};
				const g = puzzle.game || {};
				const other = puzzle.mover === 'red' ? 'blue' : 'red';
				const played = puzzle.played === true ? ' — the player found it.'
					: (puzzle.played === false ? ' — the player missed it.' : '');
				window.SIGIL_PUZZLE_SOURCE = 'From a ' + (puzzle.variant || 'standard').replace(/_/g, ' ') + ' game'
					+ (g.date ? ' on ' + g.date : '') + ', turn ' + puzzle.turn + ': '
					+ (puzzle.mover === 'red' ? 'Red' : 'Blue') + ' (' + (g[puzzle.mover] || '?') + ') vs '
					+ (other === 'red' ? 'Red' : 'Blue') + ' (' + (g[other] || '?') + ')' + played;
				const nSolved = pool.filter(p => solved[p.id]).length;
				window.SIGIL_PUZZLE_PROGRESS = (pos + 1) + ' of ' + pool.length
					+ (mateFilter ? ' mate-in-' + mateFilter : '') + ' puzzles · ' + nSolved + ' solved on this device'
					+ (data.generated ? ' · set generated ' + data.generated.slice(0, 10) : '');
				const f = (m, label) => '<a href="puzzles.html' + (m ? '?mate=' + m : '') + '"'
					+ (mateFilter === m ? ' class="is-active"' : '') + '>' + label + '</a>';
				window.SIGIL_PUZZLE_FILTER_HTML = f(null, 'All') + f(1, 'Mate in 1') + f(2, 'Mate in 2') + f(3, 'Mate in 3');

				document.getElementById('puzzle-loading').style.display = 'none';
				document.getElementById('puzzle-root').style.display = '';
				// Start Alpine only now, so gameBoard() receives the puzzle.
				const s = document.createElement('script');
				s.defer = true;
				s.src = 'https://unpkg.com/alpinejs@3.10.4/dist/cdn.min.js';
				document.body.appendChild(s);
			})();
		</script>
	</body>
</html>
