<!DOCTYPE html>
<html class="height:100%" id="html" lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<link href="static/css/global.css?v202305191" rel="stylesheet" />
		<link href="static/css/layout.css" rel="stylesheet" />
		<link href="static/css/styles.css" rel="stylesheet" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Arvo&family=Overlock&display=swap" rel="stylesheet" />
		<link href="https://use.typekit.net/rot4udi.css" rel="stylesheet" />
		<title>Puzzles - Sigil Online</title>
		<style>
			header { position: absolute; }
			body > .main { padding-top: 0px; }

			.puzzle-panel {
				font-family: 'Overlock', sans-serif;
				color: var(--color-text-warm, #eee);
				padding: 56px 0 8px;
			}
			.puzzle-panel__title {
				font-family: 'Arvo', serif;
				font-size: 1.35em;
				margin: 0 0 2px;
			}
			.puzzle-panel__title--red { color: #e0604a; }
			.puzzle-panel__title--blue { color: #5aa0e6; }
			.back-link { color: var(--color-accent); }
			.puzzle-panel__sub {
				color: var(--color-text-muted, #aaa);
				font-size: 0.9em;
				margin: 0 0 8px;
			}
			.puzzle-panel__status {
				min-height: 1.4em;
				font-size: 1.05em;
				margin: 6px 0;
			}
			.puzzle-panel__status--solved { color: #6fd46f; font-weight: bold; }
			.puzzle-panel__status--failed { color: #e0604a; }
			.puzzle-panel__diag {
				margin: 6px 0;
				padding: 8px 10px;
				border: 1px solid #c9a227;
				border-radius: 6px;
				background: rgba(201, 162, 39, 0.12);
				color: #f0d77a;
				font-size: 0.85em;
				word-break: break-all;
			}
			.puzzle-panel__solution {
				margin: 8px 0;
				padding: 10px 12px;
				border-radius: 6px;
				border: 1px solid #d4af37;
				background: rgba(212, 175, 55, 0.12);
				font-size: 1.02em;
			}
			.puzzle-panel__solution strong { color: #f0d77a; }
			/* The revealed solution's nodes: a pulsing gold ring, distinct from the
			   red/blue legal-move rings the game itself draws. */
			.stone-node--solution::after {
				content: '';
				position: absolute; inset: -6px;
				border: 3px solid #f0d77a;
				border-radius: 50%;
				box-shadow: 0 0 10px 3px rgba(240, 215, 122, 0.8);
				animation: puzzle-solution-pulse 1s ease-in-out infinite alternate;
				pointer-events: none;
			}
			@keyframes puzzle-solution-pulse { from { opacity: 0.45; } to { opacity: 1; } }
			.puzzle-panel__solution li { margin: 2px 0 2px 1em; }
			.puzzle-panel__nav {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin: 10px 0 4px;
			}
			.puzzle-panel__nav .action-button { margin: 0; }
			.puzzle-panel__progress {
				color: var(--color-text-muted, #aaa);
				font-size: 0.85em;
				margin-top: 6px;
			}
			.puzzle-panel__filters { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
			.puzzle-panel__filter a { color: inherit; margin-right: 10px; }
			.puzzle-panel__filter a.is-active { font-weight: bold; text-decoration: underline; }
			.puzzle-panel__filter select {
				font: inherit; color: inherit; background: transparent;
				border: 1px solid var(--color-text-muted, #aaa); border-radius: 4px; padding: 1px 4px;
			}
			.puzzle-panel__filter select option { color: #222; }
			.puzzle-panel__daily { color: #f0d77a; }
			.puzzle-panel__rating { margin-top: 4px; color: var(--color-text-warm, #eee); }
			.puzzle-panel__tags { color: var(--color-text-muted, #aaa); font-size: 0.85em; margin: 0 0 6px; }
			.puzzle-loading { padding: 80px 0; text-align: center; color: var(--color-text-muted, #aaa); }
		</style>
		<script>
			var webpDetector = new Image();
			webpDetector.onload = function () { document.documentElement.classList.add('webp'); };
			webpDetector.src = 'data:image/webp;base64,UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoBAAEAAwA0JaQAA3AA/vuUAAA=';
		</script>
		<script src="static/scripts/theme-manager.js"></script>
		<script src="static/scripts/settings-panel.js"></script>
	</head>

	<body>
		<header>
			<div class="container">
				<div class="header-container">
					<div>
						<h1 class="logo">
							<a href="./"><span class="visually-hidden">Sigil Online</span><img alt="" src="static/images/logo-icon.svg" height="40" width="32" /></a>
						</h1>
					</div>
					<h1></h1>
					<div id="auth-status"></div>
				</div>
			</div>
		</header>

		<div class="main">
			<div id="puzzle-loading" class="puzzle-loading">Loading puzzles…</div>

			<!-- Filled in by boot() once the puzzle set is loaded; Alpine is
			     started only after window.SIGIL_PUZZLE exists so the board
			     component can take the puzzle as an x-data argument. -->
			<div id="puzzle-root" style="display:none">
				<div x-data="gameBoard({ puzzle: window.SIGIL_PUZZLE })">
					<div class="container">
						<div class="container__inner">
							<div class="puzzle-panel">
								<h2 class="puzzle-panel__title"
									x-bind:class="puzzle.mover === 'red' ? 'puzzle-panel__title--red' : 'puzzle-panel__title--blue'"
									x-text="window.SIGIL_PUZZLE_TITLE"></h2>
								<p class="puzzle-panel__sub" x-text="window.SIGIL_PUZZLE_SOURCE"></p>
								<p class="puzzle-panel__tags" x-text="window.SIGIL_PUZZLE_TAGS" x-show="window.SIGIL_PUZZLE_TAGS"></p>
								<p class="puzzle-panel__sub" x-show="puzzleStatus === 'playing' && puzzleStep === 0"
									x-text="puzzle.kind === 'winning' ? 'Find the turn that keeps a winning game: it keeps a ' + Math.round(100 * puzzle.p_best) + '% chance to win, and no other turn the engine tried keeps more than ' + Math.round(100 * puzzle.p_second) + '%.' : (puzzle.mate === 1 ? 'Find the turn that wins the game immediately.' : (puzzle.mate === 2 ? 'Find the turn that forces a win next turn, whatever the reply.' : 'Find the turn that forces a win within three of your turns, whatever the replies.'))"></p>
								<p class="puzzle-panel__sub" x-show="puzzleStatus === 'playing' && puzzleStep === 0">Moves off the stored solution are judged by the engine (a few seconds); the AI always replies, and play continues even after a miss.</p>

								<div class="puzzle-panel__status"
									x-bind:class="{ 'puzzle-panel__status--solved': puzzleStatus === 'solved', 'puzzle-panel__status--failed': puzzleStatus === 'failed' }"
									x-text="puzzleMessage"></div>

								<p class="puzzle-panel__sub" x-show="puzzleJudge" x-text="puzzleJudge" x-cloak></p>

								<div class="puzzle-panel__diag" x-show="puzzleDiagnostic" x-cloak>
									<strong>Engine disagreement detected.</strong>
									<span x-text="puzzleDiagnostic"></span>
									<br />Puzzle position: <span x-text="puzzle.sfn"></span>
								</div>

								<div class="puzzle-panel__solution" x-show="puzzleSolutionText.length" x-cloak>
									<strong>Solution</strong>
									<ul>
										<template x-for="line in puzzleSolutionText"><li x-text="line"></li></template>
									</ul>
								</div>

								<div class="puzzle-panel__nav">
									<button class="action-button" x-on:click="puzzleRetry()" x-show="puzzleStatus !== 'playing' || puzzleStep > 0">Retry</button>
									<button class="action-button" x-on:click="puzzleShowSolution()" x-show="puzzleStatus !== 'solved' && puzzleStatus !== 'revealed'">Show solution</button>
									<a class="action-button" x-bind:href="window.SIGIL_PUZZLE_NAV.prev" x-show="window.SIGIL_PUZZLE_NAV.prev">&larr; Previous</a>
									<a class="action-button" x-bind:href="window.SIGIL_PUZZLE_NAV.next" x-show="window.SIGIL_PUZZLE_NAV.next">Next &rarr;</a>
									<a class="action-button" x-bind:href="window.SIGIL_PUZZLE_NAV.rated" title="An unattempted puzzle near your rating">Next rated</a>
									<a class="action-button" x-bind:href="window.SIGIL_PUZZLE_NAV.random">Random</a>
								</div>
								<div class="puzzle-panel__progress">
									<span x-text="window.SIGIL_PUZZLE_PROGRESS"></span>
									<span class="puzzle-panel__daily" id="puzzle-daily-status"></span>
									<div class="puzzle-panel__rating" id="puzzle-rating-status"></div>
									<div class="puzzle-panel__filters" x-html="window.SIGIL_PUZZLE_FILTER_HTML"></div>
								</div>
							</div>

							<template x-if="messageHistory.length > 0">
								<ul class="feed feed--history" x-ref="messageHistory">
									<template x-for="message in messageHistory">
										<li x-text="message"></li>
									</template>
								</ul>
							</template>

							<div class="dice" x-show="!isDeathmatch">
								<div class="die die--red" x-bind:data-die-face="redSpellCounter" x-bind:title="`${redSpellCounter} spells cast`">
									<div class="die__face die__face--1"><div class="die__pip die__pip--mm"></div></div>
									<div class="die__face die__face--2"><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--tl"></div></div>
									<div class="die__face die__face--3"><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--mm"></div><div class="die__pip die__pip--tl"></div></div>
									<div class="die__face die__face--4"><div class="die__pip die__pip--bl"></div><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--tl"></div><div class="die__pip die__pip--tr"></div></div>
									<div class="die__face die__face--5"><div class="die__pip die__pip--bl"></div><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--mm"></div><div class="die__pip die__pip--tl"></div><div class="die__pip die__pip--tr"></div></div>
									<div class="die__face die__face--6"><div class="die__pip die__pip--bl"></div><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--ml"></div><div class="die__pip die__pip--mr"></div><div class="die__pip die__pip--tl"></div><div class="die__pip die__pip--tr"></div></div>
									<div class="die__face die__face--0"><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--mm"></div><div class="die__pip die__pip--tl"></div></div>
								</div>
								<div class="die die--blue" x-bind:data-die-face="blueSpellCounter" x-bind:title="`${blueSpellCounter} spells cast`">
									<div class="die__face die__face--1"><div class="die__pip die__pip--mm"></div></div>
									<div class="die__face die__face--2"><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--tl"></div></div>
									<div class="die__face die__face--3"><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--mm"></div><div class="die__pip die__pip--tl"></div></div>
									<div class="die__face die__face--4"><div class="die__pip die__pip--bl"></div><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--tl"></div><div class="die__pip die__pip--tr"></div></div>
									<div class="die__face die__face--5"><div class="die__pip die__pip--bl"></div><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--mm"></div><div class="die__pip die__pip--tl"></div><div class="die__pip die__pip--tr"></div></div>
									<div class="die__face die__face--6"><div class="die__pip die__pip--bl"></div><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--ml"></div><div class="die__pip die__pip--mr"></div><div class="die__pip die__pip--tl"></div><div class="die__pip die__pip--tr"></div></div>
									<div class="die__face die__face--0"><div class="die__pip die__pip--br"></div><div class="die__pip die__pip--mm"></div><div class="die__pip die__pip--tl"></div></div>
								</div>
							</div>

							<div class="actions" x-bind:class="{ 'actions--visible': showReset || actionList.includes('dash') || actionList.includes('pass') }">
								<button class="action-button action-button--reset-turn" x-bind:class="{ 'is-hidden': !showReset }" x-on:click="handleReset">Reset Turn</button>
								<button class="action-button action-button--dash" x-bind:class="{ 'is-hidden': !actionList.includes('dash') }" x-on:click="handleDash">Dash</button>
								<button class="action-button action-button--end-turn" x-bind:class="{ 'is-hidden': !actionList.includes('pass'), 'action-button--forfeit-armed': endTurnArmed }" x-on:click="handleEndTurn" x-text="endTurnArmed ? 'Confirm end turn?' : 'End Turn'">End Turn</button>
							</div>
						</div>
					</div>

					<div class="container" style="overflow: auto">
						<div class="container__inner game-board-container" x-ref="gameBoardContainer">
							<div class="position:relative">
								<div class="spell-fx-overlay" x-ref="spellFxOverlay"></div>
								<picture>
									<source type="image/webp" srcset="static/images/game-board.webp" />
									<img class="game-board max-width:100%" src="static/images/game-board.jpg" alt="" />
								</picture>
								<div class="spells">
									<template x-for="i in 3">
										<div>
											<div class="spell spell--tooltip-anchor charm-spell" x-bind:class="{ [`charm-spell--${i}`]: true, [`spell--tooltip-anchor-charm${i}`]: true }"></div>
											<picture>
												<source type="image/webp" x-bind:srcset="getSpellImgWebp('charm' + i)" />
												<img class="spell charm-spell" alt="" src="static/images/spacer.gif"
													x-bind:class="{ 'spell--available': actionList.includes(spellDict[`charm${i}`]), 'spell--blue-lock': blueLock === spellDict[`charm${i}`], 'spell--red-lock': redLock === spellDict[`charm${i}`], 'spell--visible': spells.images[`charm${i}`], [`charm-spell--${i}`]: true }"
													x-bind:src="getSpellImg('charm' + i)"
													x-on:click.stop="handleCharmClick(`charm${i}`)"
													x-on:click.outside="closeSpellTooltip"
													x-on:mouseout="handleSpellMouseOut(`charm${i}`)"
													x-on:mouseover="handleSpellMouseOver(`charm${i}`)" />
											</picture>
											<div class="spell-spots charm-spell" x-bind:class="`charm-spell--${i}`" x-show="useArtOnlySpells && spells.images['charm' + i]"><template x-for="pos in spellSpotTemplate('charm')"><div class="spell-spot" x-bind:style="`left:${pos[0]*100}%;top:${pos[1]*100}%`"></div></template></div>
										</div>
									</template>
									<template x-for="i in 3">
										<div>
											<div class="spell spell--tooltip-anchor ritual-spell" x-bind:class="{ [`ritual-spell--${i}`]: true, [`spell--tooltip-anchor-ritual${i}`]: true }"></div>
											<picture>
												<source type="image/webp" x-bind:srcset="getSpellImgWebp('ritual' + i)" />
												<img class="spell ritual-spell" alt="" src="static/images/spacer.gif"
													x-bind:class="{ 'spell--available': actionList.includes(spellDict[`ritual${i}`]), 'spell--blue-lock': blueLock === spellDict[`ritual${i}`], 'spell--red-lock': redLock === spellDict[`ritual${i}`], 'spell--visible': spells.images[`ritual${i}`], [`ritual-spell--${i}`]: true }"
													x-bind:src="getSpellImg('ritual' + i)"
													x-on:click.stop="handleSpellClick(`ritual${i}`)"
													x-on:click.outside="closeSpellTooltip"
													x-on:mouseout="handleSpellMouseOut(`ritual${i}`)"
													x-on:mouseover="handleSpellMouseOver(`ritual${i}`)" />
											</picture>
											<div class="spell-spots ritual-spell" x-bind:class="`ritual-spell--${i}`" x-show="useArtOnlySpells && spells.images['ritual' + i]"><template x-for="pos in spellSpotTemplate('ritual')"><div class="spell-spot" x-bind:style="`left:${pos[0]*100}%;top:${pos[1]*100}%`"></div></template></div>
										</div>
									</template>
									<template x-for="i in 3">
										<div>
											<div class="spell spell--tooltip-anchor sorcery-spell" x-bind:class="{ [`sorcery-spell--${i}`]: true, [`spell--tooltip-anchor-sorcery${i}`]: true }"></div>
											<picture>
												<source type="image/webp" x-bind:srcset="getSpellImgWebp('sorcery' + i)" />
												<img class="spell sorcery-spell" alt="" src="static/images/spacer.gif"
													x-bind:class="{ 'spell--available': actionList.includes(spellDict[`sorcery${i}`]), 'spell--blue-lock': blueLock === spellDict[`sorcery${i}`], 'spell--red-lock': redLock === spellDict[`sorcery${i}`], 'spell--visible': spells.images[`sorcery${i}`], [`sorcery-spell--${i}`]: true }"
													x-bind:src="getSpellImg('sorcery' + i)"
													x-on:click.stop="handleSpellClick(`sorcery${i}`)"
													x-on:click.outside="closeSpellTooltip"
													x-on:mouseout="handleSpellMouseOut()"
													x-on:mouseover="handleSpellMouseOver(`sorcery${i}`)" />
											</picture>
											<div class="spell-spots sorcery-spell" x-bind:class="`sorcery-spell--${i}`" x-show="useArtOnlySpells && spells.images['sorcery' + i]"><template x-for="pos in spellSpotTemplate('sorcery')"><div class="spell-spot" x-bind:style="`left:${pos[0]*100}%;top:${pos[1]*100}%`"></div></template></div>
										</div>
									</template>
								</div>
								<div class="stone-nodes" x-cloak>
									<div class="stone-node stone-node--blue stone-node--score" x-bind:class="{ [`stone-node--score-${score}`]: true }"></div>
									<template x-bind:key="node" x-for="node in Object.keys(nodes)">
										<button class="stone-node" x-bind:aria-label="nodeLabel(node)"
											x-bind:class="{
												[`stone-node--${node}`]: true,
												[`stone-node--${playerToRefill}`]: nodesToRefill[node] && playerToRefill,
												[`stone-node--${nodes[node]}`]: true,
												[`stone-node--valid-move-${validMoves[node]}`]: validMoves[node],
												'stone-node--push-source': pushSourceNode === node,
												'stone-node--last-play': lastPlay === node && !validMoves[node],
												'stone-node--refill': nodesToRefill[node],
												'stone-node--destroyed': nodes[node] === 'X',
												'stone-node--solution': !!puzzleSolutionNodes[node],
											}"
											x-bind:id="`stone-node--${node}`"
											x-on:click="handleNodeClick(node)"></button>
									</template>
								</div>
							</div>
						</div>
					</div>

					<div class="tooltip" x-bind:class="{ 'is-visible': spells.text[activeSpell] }" x-ref="spellTooltip">
						<div class="tooltip__inner">
							<h2 class="tooltip__heading" x-text="spells.text[activeSpell]?.name"></h2>
							<p class="tooltip__content" x-text="spells.text[activeSpell]?.text"></p>
							<button class="tooltip-button" x-on:click="handleCastSpell(activeSpell)" x-show="hasTouchScreen && activeSpellIsCastable">Cast Spell</button>
						</div>
					</div>
				</div>
			</div>

			<div class="container" style="text-align:center; padding: 12px 0 24px;">
				<a class="back-link" href="./">&larr; Back to menu</a>
			</div>
		</div>

		<script>
			// Stale-asset guard. On the first load after a deploy, a returning
			// visitor's old service worker serves its cached scripts with this fresh
			// page. If they predate the page (SIGIL_ASSET_EPOCH in constants.js),
			// drop the caches, refetch the page's scripts past the HTTP cache, and
			// reload once. The new worker deletes the stale cache when it activates.
			(function () {
				if (typeof SIGIL_ASSET_EPOCH !== 'undefined' && SIGIL_ASSET_EPOCH >= 2) return;
				if (!window.caches || !window.fetch) return;
				try {
					// The sentinel holds the epoch it reloaded for, so each new epoch gets its own reload.
					if (sessionStorage.getItem('sigilStaleAssetReload') === '2') return;
					sessionStorage.setItem('sigilStaleAssetReload', '2');
				} catch (e) { return; }
				document.addEventListener('DOMContentLoaded', function () {
					var urls = ['static/scripts/engine/ai-worker.js'];
					Array.prototype.forEach.call(document.scripts, function (s) {
						if (s.src && s.src.indexOf(location.origin) === 0) urls.push(s.src);
					});
					caches.keys()
						.then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
						.then(function () {
							return Promise.all(urls.map(function (u) {
								return fetch(u, { cache: 'reload' }).catch(function () {});
							}));
						})
						.catch(function () {})
						.then(function () { location.reload(); });
				});
			})();
		</script>

		<!-- Firebase SDK (sign-in status in the header only; puzzles never write) -->
		<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
		<script>
			firebase.initializeApp({
				apiKey: "AIzaSyDcYsA9GxotScZ6m92B_TDSArkeN1qMHvE",
				authDomain: "sigil-js.firebaseapp.com",
				databaseURL: "https://sigil-js-default-rtdb.firebaseio.com",
				projectId: "sigil-js",
				storageBucket: "sigil-js.firebasestorage.app",
				messagingSenderId: "174679859896",
				appId: "1:174679859896:web:9f8e5ddc4388ae73a60a4d"
			});
		</script>
		<script src="static/scripts/auth-status.js"></script>

		<script>
			/**
			 * Puzzle selection. The set is a static JSON generated offline by
			 * tools/gen_mate_puzzles.py: forced mates proven by the exhaustive
			 * Rust solver, and winning turns judged by the engine
			 * (tools/winning_turns.py), all from recorded games.
			 *
			 * URL: ?p=<index> or ?id=<id> picks a puzzle; the filters are
			 * ?set=m1|m2|m3|win (?mate=1|2|3 still works), ?d=1..5 (difficulty),
			 * ?tag=<tag>, ?mine=1 (wins the signed-in player missed in their own
			 * ranked games); ?daily=1 is today's puzzle, the same for everyone.
			 * With no pick, the first unsolved puzzle of the pool is shown.
			 */
			// Results not yet confirmed written, keyed by account and puzzle: a
			// failure held for correction, or a result whose rating write is in
			// flight. Leaving by any path (back, reload, the header, closing the
			// tab) cannot erase one -- the next visit records it first.
			const PENDING_KEY = 'sigil_puzzle_pending_results';
			const pendingKey = (uid, id) => (uid || '') + '|' + id;
			function pendingAll() {
				try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '{}') || {}; } catch (e) { return {}; }
			}
			function pendingEdit(fn) {
				try { const m = pendingAll(); fn(m); localStorage.setItem(PENDING_KEY, JSON.stringify(m)); } catch (e) { /* storage blocked */ }
			}
			// `daily` is the UTC day when the result is that day's daily puzzle.
			const pendingPut = (uid, id, solved, daily) => pendingEdit(m => { m[pendingKey(uid, id)] = { id, uid: uid || null, solved: !!solved, daily: daily || null, at: Date.now() }; });
			const pendingDrop = (uid, id) => pendingEdit(m => { delete m[pendingKey(uid, id)]; });
			const PUZZLE_SETS = { m1: 'Mate in 1', m2: 'Mate in 2', m3: 'Mate in 3', win: 'Winning turn' };
			function puzzleSet(p) { return p.kind === 'winning' ? 'win' : 'm' + p.mate; }
			function utcDay(offsetDays) {
				return new Date(Date.now() + (offsetDays || 0) * 86400000).toISOString().slice(0, 10);
			}
			/** Today's puzzle: a hash of the UTC date over the middle difficulties. */
			function dailyPuzzle(all, day) {
				const pool = all.filter(p => p.difficulty >= 2 && p.difficulty <= 4);
				const from = pool.length ? pool : all;
				let h = 2166136261;
				for (const ch of 'sigil-daily-' + day) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
				return from[h % from.length];
			}
			function readDaily() {
				try { return JSON.parse(localStorage.getItem('sigil_puzzle_daily') || '{}') || {}; } catch (e) { return {}; }
			}
			/**
			 * Daily streak: the first result on each day's puzzle counts. A
			 * solve extends the streak when yesterday's was solved too; a miss
			 * or a revealed solution ends it.
			 */
			function recordDaily(day, status) {
				const d = readDaily();
				d.done = d.done || {};
				if (d.done[day]) return d;
				d.done[day] = status;
				if (status === 'solved') {
					d.streak = d.last === utcDay(-1) ? (d.streak || 0) + 1 : 1;
					d.last = day;
					d.best = Math.max(d.best || 0, d.streak);
				} else {
					d.streak = 0;
				}
				// Keep the log short.
				const days = Object.keys(d.done).sort();
				for (const k of days.slice(0, Math.max(0, days.length - 60))) delete d.done[k];
				try { localStorage.setItem('sigil_puzzle_daily', JSON.stringify(d)); } catch (e) { /* storage blocked */ }
				return d;
			}
			function dailyText(d) {
				// A streak is live while its last solve was today or yesterday.
				const live = d.last === utcDay(0) || d.last === utcDay(-1);
				const n = live ? (d.streak || 0) : 0;
				return 'Daily streak: ' + n + (d.best ? ' (best ' + d.best + ')' : '');
			}
			/**
			 * The signed-in player's ranked games (user_games/<uid>, public),
			 * as {gameId: colour}. Unranked games are not indexed there.
			 */
			async function myGames() {
				// tools/browser/puzzle-v2-test.js stands in for a signed-in player.
				if (window.SIGIL_PUZZLE_MY_GAMES_STUB) return window.SIGIL_PUZZLE_MY_GAMES_STUB;
				const user = typeof firebaseAuthSettled === 'function' ? await firebaseAuthSettled() : null;
				if (!user) return null;
				try {
					const snap = await firebase.database().ref('user_games/' + user.uid).once('value');
					const out = {};
					snap.forEach((c) => { const v = c.val() || {}; out[c.key] = v.color; });
					return out;
				} catch (e) {
					return null;
				}
			}
			function missedByMe(p, games) {
				return !!games && p.played === false && games[p.game && p.game.id] === p.mover;
			}
			const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

			(async function boot() {
				const params = new URLSearchParams(window.location.search);
				let data;
				try {
					const res = await fetch('static/puzzles/mate_puzzles.json', { cache: 'no-cache' });
					if (!res.ok) throw new Error('HTTP ' + res.status);
					data = await res.json();
				} catch (e) {
					document.getElementById('puzzle-loading').textContent = 'Could not load the puzzle set (' + (e.message || e) + ').';
					return;
				}
				const all = data.puzzles || [];
				const legacyMate = ['1', '2', '3'].includes(params.get('mate')) ? 'm' + params.get('mate') : null;
				const filt = {
					set: PUZZLE_SETS[params.get('set')] ? params.get('set') : legacyMate,
					d: ['1', '2', '3', '4', '5'].includes(params.get('d')) ? parseInt(params.get('d'), 10) : null,
					tag: params.get('tag') || null,
					mine: params.get('mine') === '1',
				};
				const daily = params.get('daily') === '1';
				const today = utcDay(0);
				const games = filt.mine ? await myGames() : null;
				const pool = daily ? all : all.filter(p => (!filt.set || puzzleSet(p) === filt.set)
					&& (!filt.d || p.difficulty === filt.d)
					&& (!filt.tag || (p.tags || []).indexOf(filt.tag) >= 0)
					&& (!filt.mine || missedByMe(p, games)));
				if (!pool.length) {
					document.getElementById('puzzle-loading').innerHTML = filt.mine
						? (games ? 'No missed wins found in your ranked games.' : 'Sign in to see the wins you missed in your own ranked games.')
							+ ' <a href="puzzles.html">All puzzles</a>'
						: 'No puzzles match this filter. <a href="puzzles.html">All puzzles</a>';
					return;
				}
				let solved = {};
				try { solved = JSON.parse(localStorage.getItem('sigil_puzzles_solved') || '{}') || {}; } catch (e) { solved = {}; }

				// Position within the filtered pool.
				let pos = -1;
				if (daily) {
					pos = pool.indexOf(dailyPuzzle(all, today));
				} else if (params.has('p')) {
					const idx = parseInt(params.get('p'), 10);
					pos = pool.findIndex(p => p.index === idx);
				} else if (params.has('id')) {
					pos = pool.findIndex(p => p.id === params.get('id'));
				}
				// The viewer's puzzle rating (Firebase when signed in, else this device).
				let viewer = null;
				try {
					viewer = typeof firebaseAuthSettled === 'function' ? await firebaseAuthSettled() : null;
					if (viewer && viewer.isAnonymous) viewer = null;
				} catch (e) { viewer = null; }
				let rated = { rating: PUZZLE_RATING_START, plays: 0, attempts: {}, signedIn: false };
				// Results an earlier visit left unconfirmed are recorded first, each
				// where it was rated: device-mode entries (no uid -- signed out, or
				// the account read had failed) on this device's rating whoever is
				// signed in now; account entries only for that account (another
				// account signed in since is not charged; they wait for it).
				const myUid = viewer ? viewer.uid : null;
				const owed = Object.values(pendingAll()).filter(e => !e.uid || e.uid === myUid);
				const deadline = Date.now() + 8000;
				for (const e of owed) {
					const pz = all.find(p => p.id === e.id);
					if (!pz) { pendingDrop(e.uid, e.id); continue; }
					if (Date.now() > deadline) break;   // the rest wait for the next visit
					// A daily's result counts for its day even when it never settled
					// (a no-op when settle() already logged it).
					if (e.daily) recordDaily(e.daily, e.solved ? 'solved' : 'failed');
					try {
						const current = await Promise.race([loadPuzzleCurrentRating(pz), new Promise(r => setTimeout(() => r(null), 3000))]);
						const done = await Promise.race([recordPuzzleResult(e.uid ? viewer : null, pz, e.solved, current || undefined).then(() => true),
							new Promise(r => setTimeout(() => r(false), 5000))]);
						if (done) pendingDrop(e.uid, e.id);
					} catch (err) { /* offline or refused: try again next visit */ }
				}
				// Offline (or a database that never answers), the account read can
				// hang; the board must not wait for it. 4 s, then the device rating.
				const deviceRating = () => loadPuzzleRating(null);
				try {
					rated = navigator.onLine
						? await Promise.race([loadPuzzleRating(viewer),
							new Promise((resolve) => setTimeout(() => resolve(null), 4000))]) || await deviceRating()
						: await deviceRating();
				} catch (e) { /* offline: defaults */ }
				if (pos < 0) {
					// No pick: an unattempted puzzle near the player's rating.
					const next = pickRatedPuzzle(pool, rated.rating, rated.attempts, solved);
					pos = next ? pool.indexOf(next) : 0;
					if (pos < 0) pos = 0;
				}
				const puzzle = pool[pos];
				// Links keep the active filters.
				const query = (over) => {
					const q = new URLSearchParams();
					const f = Object.assign({}, filt, over || {});
					if (f.set) q.set('set', f.set);
					if (f.d) q.set('d', f.d);
					if (f.tag) q.set('tag', f.tag);
					if (f.mine) q.set('mine', '1');
					return q;
				};
				const link = (p) => {
					const q = daily ? new URLSearchParams() : query();
					q.set('p', p.index);
					return 'puzzles.html?' + q.toString();
				};
				const randomOther = () => {
					if (pool.length < 2) return puzzle;
					let r = puzzle;
					while (r === puzzle) r = pool[Math.floor(Math.random() * pool.length)];
					return r;
				};
				window.SIGIL_PUZZLE = puzzle;
				const ratedQuery = daily ? '' : query().toString();
				const ratedLink = 'puzzles.html' + (ratedQuery ? '?' + ratedQuery : '');
				window.SIGIL_PUZZLE_NAV = daily ? { prev: '', next: '', random: link(randomOther()), rated: 'puzzles.html' } : {
					rated: ratedLink,
					prev: pos > 0 ? link(pool[pos - 1]) : '',
					next: pos < pool.length - 1 ? link(pool[pos + 1]) : '',
					random: link(randomOther()),
				};
				const side = puzzle.mover === 'red' ? 'Red' : 'Blue';
				const what = puzzle.kind === 'winning' ? 'Winning turn' : 'Mate in ' + puzzle.mate;
				window.SIGIL_PUZZLE_TITLE = (daily ? 'Daily puzzle ' + today : 'Puzzle ' + (puzzle.index + 1))
					+ ' — ' + what + ', ' + side + ' to move';
				const g = puzzle.game || {};
				const other = puzzle.mover === 'red' ? 'blue' : 'red';
				const played = puzzle.played === true ? ' — the player found it.'
					: (puzzle.played === false ? ' — the player missed it.' : '');
				window.SIGIL_PUZZLE_SOURCE = 'From a ' + (puzzle.variant || 'standard').replace(/_/g, ' ') + ' game'
					+ (g.date ? ' on ' + g.date : '') + ', turn ' + puzzle.turn + ': '
					+ side + ' (' + (g[puzzle.mover] || '?') + ') vs '
					+ (other === 'red' ? 'Red' : 'Blue') + ' (' + (g[other] || '?') + ')' + played;
				window.SIGIL_PUZZLE_TAGS = (puzzle.difficulty ? 'Difficulty ' + puzzle.difficulty + '/5' : '')
					+ ((puzzle.tags || []).length ? ' · ' + puzzle.tags.join(', ') : '');
				const nSolved = pool.filter(p => solved[p.id]).length;
				window.SIGIL_PUZZLE_PROGRESS = daily ? 'One puzzle a day, the same for everyone.'
					: (pos + 1) + ' of ' + pool.length + ' puzzles · ' + nSolved + ' solved on this device'
						+ (data.generated ? ' · set generated ' + data.generated.slice(0, 10) : '');

				// Filter bar: puzzle class, difficulty, theme, and the player's own.
				const a = (over, label, active) => '<a href="puzzles.html?' + query(over).toString() + '"'
					+ (active ? ' class="is-active"' : '') + '>' + esc(label) + '</a>';
				const counts = {};
				for (const p of all) for (const t of (p.tags || [])) counts[t] = (counts[t] || 0) + 1;
				const tags = Object.keys(counts).sort();
				const sets = Object.keys(PUZZLE_SETS).filter(k => all.some(p => puzzleSet(p) === k));
				window.SIGIL_PUZZLE_FILTER_HTML =
					'<span class="puzzle-panel__filter"><a href="puzzles.html?daily=1"' + (daily ? ' class="is-active"' : '') + '>Daily puzzle</a>'
					+ a({ set: null }, 'All', !daily && !filt.set)
					+ sets.map(k => a({ set: k }, PUZZLE_SETS[k], !daily && filt.set === k)).join('') + '</span>'
					+ '<span class="puzzle-panel__filter">Difficulty: ' + a({ d: null }, 'Any', !filt.d)
					+ [1, 2, 3, 4, 5].map(d => a({ d }, String(d), filt.d === d)).join('') + '</span>'
					+ '<span class="puzzle-panel__filter">Theme: <select onchange="SIGIL_PUZZLE_GO(this.value)">'
					+ '<option value="puzzles.html?' + query({ tag: null }).toString() + '">Any</option>'
					+ tags.map(t => '<option value="puzzles.html?' + query({ tag: t }).toString() + '"'
						+ (filt.tag === t ? ' selected' : '') + '>' + esc(t) + ' (' + counts[t] + ')</option>').join('')
					+ '</select> '
					+ a({ mine: !filt.mine }, filt.mine ? 'My missed wins ✓' : 'My missed wins', filt.mine)
					+ '</span>';

				// Daily puzzle bookkeeping (the board reports each result).
				const ratingEl = document.getElementById('puzzle-rating-status');
				const showRating = (extra) => {
					ratingEl.textContent = 'Your puzzle rating: ' + rated.rating
						+ (rated.signedIn ? '' : ' (this device; sign in to keep it)')
						+ ' · this puzzle: ' + puzzleNow.rating + (extra || '');
				};
				let puzzleNow = { rating: Math.round(puzzle.rating || PUZZLE_RATING_START), plays: 0 };
				showRating();
				// A result waits for this read (up to 4 s), so a quick guest result
				// is computed against the live rating, not the calibration.
				const puzzleLive = Promise.race([
					loadPuzzleCurrentRating(puzzle).then((r) => { puzzleNow = r; showRating(); }),
					new Promise((r) => setTimeout(r, 4000))]).catch(() => {});
				let rating_recorded = false;
				let recording = null;
				// The identity the rating line was built from: when the account
				// could not be read (offline, or the read timed out), results go
				// to the device rating shown, not to a server write that may hang.
				const ratingUser = rated.signedIn ? viewer : null;
				// A result is saved before the page leaves: links in the puzzle
				// panel wait (up to 5 s) for a pending rating write.
				window.addEventListener('pagehide', () => { if (pendingFail) settle('failed'); });
				window.SIGIL_PUZZLE_GO = (url) => {
					if (pendingFail) settle('failed');      // leaving: the failure stands
					if (!recording) { location.href = url; return; }
					Promise.race([recording, new Promise((r) => setTimeout(r, 5000))])
						.finally(() => { location.href = url; });
				};
				document.getElementById('puzzle-root').addEventListener('click', (ev) => {
					const link = ev.target.closest && ev.target.closest('a[href]');
					if (!link || !(recording || pendingFail)) return;
					ev.preventDefault();
					window.SIGIL_PUZZLE_GO(link.href);
				}, true);
				// The result that counts: a solve, a reveal, or a failure that can
				// no longer be corrected. A failed mate puzzle can still turn into a
				// solve (the mover wins within the count after the judge ruled an
				// escape), so its failure is recorded once that is impossible
				// ('failed-final') or when the player leaves the puzzle.
				let pendingFail = false;
				const settle = (final) => {
					if (rating_recorded) return;
					rating_recorded = true;
					pendingFail = false;
					const uid = ratingUser ? ratingUser.uid : null;
					pendingPut(uid, puzzle.id, final === 'solved', daily ? today : null);   // until the write lands
					recording = puzzleLive.then(() => recordPuzzleResult(ratingUser, puzzle, final === 'solved', puzzleNow)).then((r) => {
						pendingDrop(uid, puzzle.id);   // recorded (or attempted before): nothing left pending
						if (!r) { showRating(' · already attempted, rating unchanged'); return; }
						rated.rating = r.after;
						puzzleNow = { rating: r.puzzleAfter, plays: puzzleNow.plays + 1 };
						showRating(' · ' + (r.delta >= 0 ? '+' : '') + r.delta);
					}).catch((e) => { showRating(' · rating not saved (' + (e && e.message || e) + ')'); })
						.finally(() => { recording = null; });
					if (daily) {
						const d = recordDaily(today, final === 'solved' ? 'solved' : (final === 'revealed' ? 'revealed' : 'failed'));
						document.getElementById('puzzle-daily-status').textContent = ' · ' + dailyText(d);
					}
				};
				window.SIGIL_PUZZLE_ON_RESULT = function (p, status) {
					if (p.id !== puzzle.id) return;
					if (status === 'failed' && puzzle.kind !== 'winning') {
						// Held in storage too (see PENDING_KEY).
						pendingFail = true;
						pendingPut(ratingUser ? ratingUser.uid : null, puzzle.id, false, daily ? today : null);
						return;
					}
					if (status === 'failed-final' || status === 'retry') { if (pendingFail) settle('failed'); return; }
					settle(status);
				};
				const d0 = readDaily();
				if (daily || d0.streak) {
					document.getElementById('puzzle-daily-status').textContent = ' · ' + dailyText(d0)
						+ (daily && d0.done && d0.done[today] ? ' — today\'s result is in (' + d0.done[today] + ')' : '');
				}

				document.getElementById('puzzle-loading').style.display = 'none';
				document.getElementById('puzzle-root').style.display = '';
				// Start Alpine only now, so gameBoard() receives the puzzle.
				const s = document.createElement('script');
				s.defer = true;
				s.src = 'https://unpkg.com/alpinejs@3.10.4/dist/cdn.min.js';
				document.body.appendChild(s);
			})();
		</script>
