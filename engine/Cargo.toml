[package]
name = "sigil_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "sigil_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# Native CPython extension module (maturin / PyO3) - the harnesses use this.
python = ["pyo3"]
# Browser build: wasm32-unknown-unknown via wasm-bindgen. Mutually exclusive with
# `python`, since a CPython extension module cannot be a wasm module.
wasm = ["wasm-bindgen", "js-sys"]
# Threaded browser build (2026-10-12): the native parallel root on rayon's pool
# of Web Workers over shared wasm memory. Needs nightly + build-std with
# +atomics (engine/build-wasm-mt.sh) and a cross-origin-isolated page.
wasm-threads = ["wasm", "dep:rayon", "dep:wasm-bindgen-rayon"]
# In-process sampling profiler for examples/profile.rs only (no perf in Cloud Shell).
profile = ["dep:pprof"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }
# Pinned EXACTLY: the wasm-bindgen CLI that generates the JS glue must match
# the crate version or the glue mis-imports at runtime. build-wasm.sh asserts.
wasm-bindgen = { version = "=0.2.127", optional = true }
js-sys = { version = "0.3", optional = true }
rayon = { version = "1.10", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
pprof = { version = "0.13", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[example]]
name = "profile"
required-features = ["profile"]
